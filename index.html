icture, with each part lighting up in order."},{"n":17,"cam":[2050,640,3300],"text":"So the agency does not just send a fine. It has to bring a case, in the open, before someone who decides it. Next: can the company get into court?","alt":"The caption, they just send a fine?, is struck through. The list of terms from this walkthrough appears."}],"practice":[{"type":"cat","prompt":"Sort each item.","cats":["Rule","Order"],"items":[["A requirement that all children's websites get parental consent",0],["A decision fining one company",1],["A decision denying one person's license",1],["A standard for every lender in the country",0],["A settlement with one app maker",1]],"fb":"A rule looks forward and reaches everyone in a class. An order applies the law to one named party."},{"type":"order","prompt":"Put the steps of a case tried inside the FTC in order.","items":["The agency investigates","The commissioners vote, and a complaint is issued","An administrative law judge holds a hearing and issues an initial decision","The losing side may appeal to the commissioners","The commissioners issue the agency's final order"],"fb":"The judge's initial decision says who won. The commissioners have the last word inside the agency. Many cases leave this path early through a settlement, which becomes a consent order."},{"type":"cat","prompt":"Match each term to its meaning.","cats":["Applying the law to one party","The official inside the agency who hears the case","A settlement that becomes an order","The agency's case against a party it believes broke the law"],"items":[["adjudication",0],["administrative law judge",1],["consent order",2],["enforcement action",3]],"fb":"These are the working vocabulary of agency enforcement."},{"type":"mc","prompt":"When a case goes to a federal court instead of being tried inside the agency, who issues the binding order?","options":["The federal court","The agency","Congress","The company"],"answer":0,"fb":"In federal court, the agency is only a party, asking the judicial machine to act."},{"type":"mc","prompt":"True or false: inside an agency, the staff who prosecute a case may privately advise the judge who decides it.","options":["True","False"],"answer":1,"fb":"The APA separates those functions, even though both groups work for the same agency."},{"type":"multi","prompt":"Which of these end in an order? Select all that apply.","options":[["An enforcement decision",true],["A license decision",true],["A benefits decision",true],["A regulation published in the CFR",false]],"fb":"Orders cover more than enforcement. A regulation is a rule."},{"type":"cat","prompt":"Sort each agency decision by the kind of adjudication it is.","cats":["Formal adjudication","Informal adjudication"],"items":[["An FTC administrative proceeding heard by an administrative law judge on the record",0],["A hearing a statute requires to be decided on the record, with evidence and an initial decision",0],["A permit application granted by a staff reviewer",1],["A benefits claim decided from the papers in a file",1],["A license renewal approved without a hearing",1]],"fb":"Formal adjudication is the exception. It applies when a statute requires the decision to be made on the record after an agency hearing, and then the APA's trial-type procedures follow. Everything else is informal adjudication, which is most of what agencies do."}],"authorities":["5 U.S.C. § 551(6)-(7) (defining an \"order\" as an agency's final disposition in a matter other than rule making, including licensing, and \"adjudication\" as the agency process for formulating an order).","5 U.S.C. § 554(a) (applying the APA's formal adjudication procedures \"in every case of adjudication required by statute to be determined on the record after opportunity for an agency hearing,\" subject to listed exceptions).","5 U.S.C. §§ 556-557 (setting the hearing and decision procedures for those cases, including who may preside, the taking of evidence, and the initial or recommended decision).","15 U.S.C. § 45(m)(1)(A) (authorizing the Commission to commence a civil action in a United States district court to recover a civil penalty from anyone who violates a rule respecting unfair or deceptive acts or practices with actual knowledge, or knowledge fairly implied on the basis of objective circumstances, that the act is prohibited by the rule).","<i>SEC v. Jarkesy</i>, 603 U.S. 109 (2024) (holding that when the SEC seeks civil penalties against a defendant for securities fraud, the Seventh Amendment entitles the defendant to a jury trial, so the action must be brought in federal court rather than decided in the agency's own proceeding).","<i>Withrow v. Larkin</i>, 421 U.S. 35 (1975) (holding that combining investigative and adjudicative functions in one agency does not, without more, violate due process)."]},{"n":5,"title":"Can the company get into court?","minutes":6,"build":"buildTrip4","intro":"Scroll down at your own pace. This walkthrough follows the video app from Walkthrough 4 down the road to the courts, through the gates it has to pass on the way. The text for each step appears beside the picture.","version":"Scroll lesson v0.5, built from script v0.4.","cardTerms":{"3":["judicial review"],"5":["standing"],"6":["final agency action"],"7":["exhaustion"],"8":["ripeness"],"10":["petition for review"],"11":["administrative record"],"12":["stay"]},"terms":["judicial review","standing","final agency action","exhaustion","ripeness","petition for review","administrative record","stay"],"beats":[{"n":1,"cam":[760,440,1500],"text":"Walkthrough 4 ended with a final order gripping one company: the video app. The company thinks the FTC got the law wrong. It wants a court to look. Can it get one to?","alt":"The FTC, closed again, with the narrow belt stamped Order running to the video app's gear."},{"n":2,"cam":[3470,380,1150],"text":"A common guess is that courts watch over the agencies and step in when something goes wrong. They do not. A court acts only when someone brings it a case. Not everyone can bring one, and not at any time.","alt":"Far down the road, the Courts casing, closed. The caption reads: courts watch the agencies?"},{"n":3,"cam":[2200,420,2950],"text":"When a court examines what an agency did and decides whether it was lawful, that is judicial review. The APA gives a general right to it: a person harmed by an agency's action can ask a court to review that action. Other statutes often say which court. The FTC's orders go to a federal court of appeals, an Article III court.","alt":"A dashed road appears, running from the video app to the Courts casing."},{"n":4,"cam":[2200,420,2950],"text":"But the road has gates. Each gate asks one question. Fail any of them and the court never reaches the real issue, which is whether the agency was right.","alt":"Four gates appear across the road, one after another, each with its bar down."},{"n":5,"cam":[1500,480,1050],"text":"Gate one: are you the right person? This is standing. You need a real injury, caused by what the agency did, that a court could fix. The video app has been ordered to delete data and report for years. It has standing. A blogger who simply dislikes the order does not.","alt":"At gate one, a figure labeled a blogger who disagrees is stopped. The company's petition passes and the bar lifts."},{"n":6,"cam":[1950,480,1050],"text":"Gate two: has the agency finished? Courts review final agency action: the agency's last word, with real legal consequences. An investigation letter is not final. A proposed rule is not final. A judge's initial decision that is still on appeal to the commissioners is not final.","alt":"At gate two, pages labeled investigation letter and proposed rule are stopped. The petition, carrying a final order, passes."},{"n":7,"cam":[2400,480,1050],"text":"Gate three: did you use the agency's own steps first? This is exhaustion. When the statute or the agency's rules require an appeal inside the agency, you must take it before going to court. The video app appealed to the commissioners, so it passes.","alt":"At gate three, a page labeled skipped the appeal is stopped. The petition passes."},{"n":8,"cam":[2850,480,1050],"text":"Gate four: is the dispute ready? This is ripeness. Courts decide concrete disputes, not worries about what might happen. A company that only fears a rule may someday be applied to it is often too early.","alt":"At gate four, a small gear labeled a company that only fears the rule is stopped. The petition passes."},{"n":9,"cam":[3250,360,1150],"text":"A challenger can be too early, and it can also be too late. Statutes set deadlines for seeking review, and they are often short. For an FTC order, the company has 60 days. Miss the deadline and the order stands, however wrong it may be.","alt":"At the courthouse door, a clock labeled 60 days."},{"n":10,"cam":[2200,440,2950],"text":"The video app clears every gate, on time. It files a petition for review: the document that asks the court to examine the agency's order. Now the court has a case, and only now.","alt":"The petition travels the whole road, each bar lifting as it arrives, and enters the Courts casing, whose gear begins to turn."},{"n":11,"cam":[1910,330,3700],"text":"The court does not start over. There is no new trial and there are no new witnesses. The agency sends the court the administrative record: everything that was in front of the agency when it decided. The court judges the agency on that record.","alt":"A box labeled Record travels from the FTC to the Courts casing along an upper path."},{"n":12,"cam":[720,460,1150],"text":"Filing the petition does not pause the order. It keeps gripping the company unless the court puts a temporary hold on it, called a stay. In this series, a stay is a clamp.","alt":"A clamp closes on the narrow order belt, and the belt stops moving."},{"n":13,"cam":[560,560,1350],"text":"One more limit. Some choices belong to the agency alone. A parent who is angry that the FTC never brought a case against some other app generally cannot get a court to order one. Deciding whether to enforce is left to the agency.","alt":"Beside the FTC, a figure labeled a parent who wants the agency to act, and a sign on the casing: whether to bring a case, the agency's choice."},{"n":14,"cam":[1910,430,3800],"text":"Here is the whole road. The right person, a finished decision, the agency's own steps used, a dispute that is ready, and a petition filed on time. Then the record follows, and the order keeps gripping unless the court clamps it.","alt":"The whole picture, with each part lighting up in order."},{"n":15,"cam":[1910,430,3800],"text":"So courts do not watch over agencies. They wait for the right case, brought by the right person, at the right time. Next: what does the court inspect, and what can it do?","alt":"The caption, courts watch the agencies?, is struck through. The list of terms from this walkthrough appears."}],"practice":[{"type":"cat","prompt":"Match each gate to the question it asks.","cats":["Has this person been harmed by what the agency did?","Has the agency finished deciding?","Is the dispute ready for a court now?","Did the person first use the steps available inside the agency?"],"items":[["standing",0],["final agency action",1],["ripeness",2],["exhaustion",3]],"fb":"These are the gates a challenger must pass before a court will look at whether the agency was right."},{"type":"mc","prompt":"An agency publishes a proposed rule and asks for comments. A company sues at once to stop it. What is the most likely result?","options":["The court will not hear the case yet, because there is no final agency action","The court cuts the rule","The court orders Congress to act","The agency must withdraw the proposal"],"answer":0,"fb":"A proposal is not a finished decision. For now, the company's remedy is to comment."},{"type":"mc","prompt":"True or false: federal courts review agency rules on their own initiative, whether or not anyone sues.","options":["True","False"],"answer":1,"fb":"Courts do not patrol. They act only when a party with standing brings a case."},{"type":"cat","prompt":"Sort each person.","cats":["Likely has standing","Likely does not"],"items":[["A company fined under the rule",0],["A company that must change its product to comply",0],["A person who read about the rule and disagrees with it",1],["A student writing a paper about the rule",1]],"fb":"Standing requires a real harm to the person suing, not just disagreement."},{"type":"mc","prompt":"True or false: once a company files a petition for review, the agency's order is automatically paused until the court decides.","options":["True","False"],"answer":1,"fb":"The order keeps gripping unless the court grants a stay, which this series draws as a clamp."},{"type":"multi","prompt":"When a court reviews an agency's order, what does it look at? Select all that apply.","options":[["The administrative record: what was in front of the agency when it decided",true],["The agency's written explanation of its decision",true],["New witnesses the company calls at a fresh trial",false],["Evidence the agency gathered after it decided",false]],"fb":"The court does not start over. It judges the agency on the record the agency had."}]},{"n":6,"title":"What does the court inspect, and what can it do?","minutes":8,"build":"buildTrip6","intro":"Scroll down at your own pace. This walkthrough opens the court. You will watch the FTC's order pass four inspection stations, and then see what the court can do with it. The text for each step appears beside the picture.","version":"Scroll lesson v0.7, built from script v0.5.","cardTerms":{"4":["Article III court","Article I courts"],"6":["ultra vires"],"8":["major questions doctrine"],"10":["arbitrary and capricious"],"11":["substantial evidence"],"12":["due process"],"14":["sets it aside"],"15":["remand"],"16":["remand without vacatur"]},"cardItalic":{"7":["Loper Bright Enterprises v. Raimondo","Chevron"],"8":["West Virginia v. EPA","Biden v. Nebraska"]},"terms":["Article III court","Article I court","ultra vires","major questions doctrine","arbitrary and capricious","substantial evidence","due process","set aside","remand","remand without vacatur"],"authorities":["U.S. Const. art. III, § 1 (vesting the judicial power in the Supreme Court and the lower courts Congress creates, whose judges \"shall hold their Offices during good Behaviour\" and whose pay \"shall not be diminished\").","5 U.S.C. § 706 (directing the reviewing court to \"decide all relevant questions of law\" and to set aside agency action on the grounds listed).","5 U.S.C. § 706(2)(A) (directing the court to set aside agency action that is arbitrary, capricious, an abuse of discretion, or otherwise not in accordance with law: the standard for an agency's explanation, and for its factual findings outside formal proceedings).","5 U.S.C. § 706(2)(E) (directing the court to set aside agency action unsupported by substantial evidence in a case subject to sections 556 and 557, that is, formal adjudication or formal rulemaking: the standard for the FTC's factual findings here).","15 U.S.C. § 45(c) (giving a court of appeals power to affirm, modify, or set aside an FTC order, and making the Commission's findings of fact conclusive \"if supported by evidence\").","26 U.S.C. § 7441 (establishing the United States Tax Court as a court under Article I).","<i>Chevron U.S.A. Inc. v. Natural Res. Def. Council, Inc.</i>, 467 U.S. 837 (1984) (directing courts to defer to an agency's reasonable reading of an ambiguous statute it administers), <i>overruled by</i> <i>Loper Bright Enters. v. Raimondo</i>, 603 U.S. 369 (2024).","<i>Loper Bright Enters. v. Raimondo</i>, 603 U.S. 369 (2024) (holding that courts must exercise their independent judgment in deciding whether an agency has acted within its statutory authority).","<i>West Virginia v. EPA</i>, 597 U.S. 697 (2022) (holding that an agency claiming power over a question of vast economic and political significance must point to clear congressional authorization).","<i>Biden v. Nebraska</i>, 600 U.S. 477 (2023) (applying the major questions doctrine to hold that the HEROES Act did not authorize the student loan forgiveness program); <i>id.</i> (Barrett, J., concurring) (describing the doctrine as a tool of ordinary textual interpretation rather than a strong clear-statement rule).","<i>SEC v. Chenery Corp.</i>, 318 U.S. 80 (1943) (holding that agency action must be judged on the grounds the agency itself invoked).","<i>Motor Vehicle Mfrs. Ass'n v. State Farm Mut. Auto. Ins. Co.</i>, 463 U.S. 29 (1983) (holding that an agency must examine the relevant data and give a satisfactory explanation for its action).","<i>Universal Camera Corp. v. NLRB</i>, 340 U.S. 474 (1951) (explaining that substantial evidence means evidence a reasonable mind might accept as adequate to support a conclusion, judged on the whole record).","<i>Mathews v. Eldridge</i>, 424 U.S. 319 (1976) (setting out the factors courts weigh to decide how much process is due).","<i>Allied-Signal, Inc. v. U.S. Nuclear Regulatory Comm'n</i>, 988 F.2d 146 (D.C. Cir. 1993) (setting out when a court may remand without vacating the agency's action)."],"beats":[{"n":1,"cam":[0,0,0],"text":"Walkthrough 5 ended at the courthouse door. The video app filed its petition on time, and the FTC sent the record of its case. Now the court has to decide whether the FTC's order stands.","alt":"The FTC, its narrow order belt, and the video app. At the right, the court's casing, labeled Article III courts, still closed."},{"n":2,"cam":[0,0,0],"text":"A common guess is that the judges decide whether the order was a good idea. They do not. A court does not swap in its own view of good policy. It inspects the agency's work for specific defects, and it works from the record.","alt":"Close on the closed casing. The caption reads: judges decide if it was a good idea?"},{"n":3,"cam":[0,0,0],"text":"Open the court's casing. FTC orders go to a United States court of appeals, where a panel of judges, usually three, hears the case. By statute, the court may affirm, modify, or set aside the FTC's order.","alt":"The casing opens into a wide room labeled U.S. Court of Appeals, Article III, with three judges above it and the court's gear inside."},{"n":4,"cam":[0,0,0],"text":"This is an Article III court: part of the judicial branch the Constitution creates in Article III. Its judges are appointed by the President with the Senate's consent, serve during good behavior, and cannot have their pay cut. Congress has also created Article I courts, like the U.S. Tax Court, whose judges serve fixed terms. And the administrative law judge from Walkthrough 4 is not a court at all. That judge works inside the agency, in the executive branch.","alt":"Three cards below the court: Article III court, the judicial branch, judges serve during good behavior, pay cannot be cut; Article I court, created by Congress, such as the U.S. Tax Court, judges serve fixed terms; and Administrative law judge, works inside the agency, the executive branch, not a court at all."},{"n":5,"cam":[0,0,0],"text":"What the court may inspect is set by law, mainly section 706 of the APA. In this series we group it into four questions. The court works through them in order, and a failure at any one can sink the order.","alt":"Four inspection stations appear along a bench: 1, fit; 2, steps; 3, reasoning; 4, Constitution, each with its question beneath."},{"n":6,"cam":[0,0,0],"text":"First: does the agency's belt fit inside Congress's belt? The app argues it is not a site \"directed to children,\" so the COPPA statute never reached it. If an agency acts beyond the power its statute gives, it acted ultra vires, beyond its powers.","alt":"Station 1. A short piece of the order lies on the bench. Above it, Congress's belt stamped COPPA inside a gauge, and a card: directed to children, does the COPPA statute reach this app?"},{"n":7,"cam":[0,0,0],"text":"Who decides what \"directed to children\" means? For forty years, under a 1984 Supreme Court case called Chevron, courts often deferred to an agency's reasonable reading of an unclear statute. In 2024, in Loper Bright Enterprises v. Raimondo, the Supreme Court overruled that case. Now the court decides what the statute means, using its own judgment. The agency's view can persuade, but it does not control.","alt":"Beside the gauge, a card: who reads the statute? The court. Loper Bright, 2024."},{"n":8,"cam":[0,0,0],"text":"One more fit question comes up when the load is heavy. When an agency claims power over a question of vast economic and political significance, courts ask for clear authorization from Congress. That is the major questions doctrine. The Supreme Court named it in West Virginia v. EPA (2022) and applied it again in Biden v. Nebraska (2023). The justices still disagree about how strong it is and when it applies. A single order against one app does not raise it. A rule reshaping the whole online economy might.","alt":"At station 1, a thin blue belt labeled an old, narrow grant above a thick amber block labeled an enormous rule. Beside them, a card citing West Virginia v. EPA, 2022, and Biden v. Nebraska, 2023, still debated. Station 1's check lights."},{"n":9,"cam":[0,0,0],"text":"Second: did the agency follow the steps the law requires? For a rule, that means notice and comment. For an order like this one, it means the hearing steps the statute sets out. A skipped step can sink the action, however sound the result.","alt":"The order slides to station 2. A checklist: notice of the charges, a hearing, a decision on the record. Station 2's check lights."},{"n":10,"cam":[0,0,0],"text":"Third: did the agency explain its way to the result? The court reads the agency's explanation. Did it consider the important parts of the problem? Did it show how the evidence leads to the conclusion it reached, and not to some other one? If not, the action is arbitrary and capricious, even if the evidence itself was ample. The leading case is State Farm, from 1983. And the agency is judged on the reasons it gave at the time, not new ones its lawyers invent in court.","alt":"The order slides to station 3. A page titled the agency's explanation, under a magnifying glass."},{"n":11,"cam":[0,0,0],"text":"A separate question about the facts: was there enough evidence? The FTC found facts at the hearing: what the app's content looked like, who its ads were aimed at, how old its users were. Because the FTC decided this case by formal adjudication, a hearing on the record (Walkthrough 4), the court asks whether substantial evidence supports those findings: enough that a reasonable person could accept the conclusion, even if the judges might have weighed it differently. In informal adjudication or rulemaking, the same question is asked under the arbitrary and capricious standard instead. So there are two ways to fail here: too little evidence, or enough evidence with no explanation connecting it to the result.","alt":"A box labeled Record appears beside the explanation. Station 3's check lights."},{"n":12,"cam":[0,0,0],"text":"Fourth: does the order violate the Constitution? For an order aimed at one party, a common claim is due process: the company must get notice of the charges and a fair chance to be heard before the government acts against it.","alt":"A dial, the constitutionality gauge, labeled due process. Four unlabeled scales sit alongside it, for other constitutional claims a court could read instead. A red zone at one end is marked violation. The needle rests at the safe end, away from the red zone."},{"n":13,"cam":[0,0,0],"text":"Notice what is not on the list. The judges do not ask whether 13 was the right age, or whether they would have written the order the same way. Those choices belong to Congress and the agency.","alt":"All four stations. Below the bench, a dashed card, was it a good idea?, is struck through and labeled not the court's question."},{"n":14,"cam":[0,0,0],"text":"Then the verdict. If the order passes, the court affirms it, and the belt keeps gripping. If it fails, the court sets it aside: it cuts that one belt. The FTC keeps operating, and every other rule and order stays in force.","alt":"Back at the real belt. First the tag Affirmed. Then the other outcome: the belt is cut and fades, and the FTC, still turning, is labeled keeps operating."},{"n":15,"cam":[0,0,0],"text":"What happens next depends on why the belt was cut. Often the court sends the matter back to the agency, which is a remand. If the explanation was the problem, the agency can fix it and act again. If the agency went beyond its statute, no explanation can fix that. Only Congress can.","alt":"A dashed road runs from the court back to the FTC, labeled back to the agency."},{"n":16,"cam":[0,0,0],"text":"Sometimes the court leaves the belt in place while the agency fixes its explanation. That is remand without vacatur. Courts use it when the defect is curable and cutting the belt in the meantime would cause more harm than good.","alt":"The belt is whole again, tagged stays in place, with the road back to the agency still showing."},{"n":17,"cam":[0,0,0],"text":"So the court does not ask whether the order was a good idea. It asks four questions: fit, steps, reasoning, and the Constitution. Every malfunction in the simulation's Diagnose mode is an answer to one of them. Next: who controls the agency?","alt":"The whole picture with all four checks lit. The caption is struck through. The list of terms from this walkthrough appears."}],"practice":[{"type":"cat","prompt":"Match each problem to the doctrine a challenger would invoke.","cats":["ultra vires","major questions doctrine","failure to follow required procedure","arbitrary and capricious","due process"],"items":[["The order goes beyond the words of the statute",0],["An old, narrow provision is used for an enormous new program",1],["The agency skipped a step the law requires",2],["The agency did not adequately explain its decision",3],["The company got no notice and no chance to be heard",4]],"fb":"Each doctrine names a different place where the machine can break."},{"type":"cat","prompt":"Sort each defect.","cats":["The agency can fix it and try again","A better explanation will not fix it"],"items":[["A skipped procedural step",0],["An inadequate explanation",0],["An order that goes beyond the statute",1],["A major question with no clear authorization from Congress",1]],"fb":"If the agency lacks the power, only Congress can supply it."},{"type":"mc","prompt":"When the words of a statute are unclear, who decides what they mean?","options":["The court, using its own judgment","The agency, and the court must accept its reading","The President","The regulated company"],"answer":0,"fb":"This has been the rule since Loper Bright in 2024. The agency's view can persuade, but it does not control."},{"type":"mc","prompt":"True or false: when a court sets aside one of an agency's orders, the agency has to stop all of its work.","options":["True","False"],"answer":1,"fb":"The court cuts one belt. The agency keeps operating, and its other rules and orders stay in force."},{"type":"mc","prompt":"A court reviewing the FTC's findings of fact asks whether substantial evidence supports them. What does that mean?","options":["Enough evidence that a reasonable person could accept the conclusion","The judges would have reached the same conclusion themselves","The evidence proves the facts beyond a reasonable doubt","The company offered no evidence at all"],"answer":0,"fb":"The court does not reweigh the evidence. It asks whether the agency's finding was reasonable on the record."},{"type":"multi","prompt":"Which of these does a reviewing court ask? Select all that apply.","options":[["Does the agency's action fit inside its statute?",true],["Did the agency follow the required steps?",true],["Did the agency explain its decision, based on the evidence?",true],["Would the judges have chosen the same policy?",false]],"fb":"The court inspects for defects. It does not swap in its own view of good policy."}]},{"n":7,"title":"Who controls the agency?","minutes":7,"build":"buildTrip7","intro":"Scroll down at your own pace. This last walkthrough asks who has a hand on the FTC: the President, Congress, the Article III courts, and the public. It ends with the whole machine, shown together for the first time.","version":"Scroll lesson v0.8, built from script v0.7.","cardTerms":{"4":["Appointments Clause","advice and consent"],"5":["independent agencies"],"7":["executive orders"],"10":["appropriations"],"11":["oversight","Congressional Review Act"],"13":["Freedom of Information Act"]},"cardItalic":{"5":["Humphrey's Executor v. United States"],"6":["Trump v. Slaughter","Humphrey's Executor"]},"terms":["Appointments Clause","advice and consent","independent agency","removal at will","executive order","appropriations","oversight","Congressional Review Act","Freedom of Information Act (FOIA)"],"authorities":["U.S. Const. art. II, § 1, cl. 1 (vesting the executive power in the President); <i>id.</i> § 3 (directing the President to \"take Care that the Laws be faithfully executed\").","U.S. Const. art. II, § 2, cl. 2 (providing that the President nominates officers of the United States and appoints them with the advice and consent of the Senate).","U.S. Const. art. I, § 9, cl. 7 (providing that no money may be drawn from the Treasury except through appropriations made by law).","15 U.S.C. § 41 (creating the FTC and providing that a commissioner may be removed \"for inefficiency, neglect of duty, or malfeasance in office\").","<i>Myers v. United States</i>, 272 U.S. 52 (1926) (holding that the President may generally remove executive officers at will).","<i>Humphrey's Executor v. United States</i>, 295 U.S. 602 (1935) (upholding the FTC Act's limit on removing commissioners), <i>overruled by</i> <i>Trump v. Slaughter</i>, No. 25-332 (U.S. June 29, 2026).","<i>Seila Law LLC v. CFPB</i>, 591 U.S. 197 (2020) (holding unconstitutional the for-cause removal protection of an agency led by a single director).","<i>Trump v. Slaughter</i>, No. 25-332 (U.S. June 29, 2026) (holding that the FTC Act's for-cause limit on removing commissioners violates the separation of powers, and overruling <i>Humphrey's Executor</i>).","Exec. Order No. 12,866, 58 Fed. Reg. 51,735 (Sept. 30, 1993) (requiring White House review of significant regulatory actions).","Exec. Order No. 14,215, 90 Fed. Reg. 10,447 (Feb. 18, 2025) (extending White House regulatory review to independent regulatory agencies).","5 U.S.C. §§ 801–808 (Congressional Review Act) (allowing Congress to disapprove a rule by joint resolution and barring the agency from reissuing a rule in substantially the same form).","5 U.S.C. § 553(e) (giving interested persons the right to petition an agency to issue, amend, or repeal a rule).","5 U.S.C. § 552 (Freedom of Information Act) (requiring agencies to make their records available to any person on request, subject to listed exemptions).","U.S. Const. amend. I (protecting the right \"to petition the Government for a redress of grievances\")."],"beats":[{"n":1,"cam":[0,0,0],"text":"Six walkthroughs in, you have watched the FTC write a rule, enforce it, and defend it in an Article III court. One question is left. Who controls the FTC?","alt":"The FTC, opened, with its three gears turning and its rule belt running to the companies."},{"n":2,"cam":[0,0,0],"text":"A common guess is that an agency like the FTC is a fourth branch of government that answers to no one. It is not. The Constitution creates three branches, and the FTC sits inside one of them. All three have a hand on it.","alt":"The same picture. The caption reads: a fourth branch?, above the FTC."},{"n":3,"cam":[0,0,0],"text":"The FTC sits in the executive branch, which Article II of the Constitution places under the President. In this series, control inside one branch is a shaft, not a belt. A belt carries power across a boundary. A shaft stays inside one branch.","alt":"The President's casing appears above the FTC, joined to it by a thick ink shaft that ends in a bracket labeled mounting."},{"n":4,"cam":[0,0,0],"text":"Start with how commissioners get their seats. Under the Appointments Clause, the President nominates them and the Senate must confirm them. That shared step is called advice and consent. So two branches share this hand from the start.","alt":"Congress appears at the left. A token labeled Nominee travels from the President to the Senate gear, then to the FTC's mounting."},{"n":5,"cam":[0,0,0],"text":"Can the President fire them? For ninety years the answer was: only for cause. The FTC Act lists causes for removal, \"inefficiency, neglect of duty, or malfeasance in office,\" and in 1935, in a case called Humphrey's Executor v. United States, the Supreme Court read that list as \"only for those causes\" and upheld it as a limit on the President. (The odd name: Commissioner Humphrey died while his suit was pending, and the executor of his estate carried it on.) Agencies built this way came to be called independent agencies.","alt":"A closed padlock on the shaft, labeled removal only for cause, FTC Act, 1914."},{"n":6,"cam":[0,0,0],"text":"In June 2026, in a case called Trump v. Slaughter, the Supreme Court overruled its 1935 decision in Humphrey's Executor. It held that the limit on removing FTC commissioners violates the Constitution, because the FTC exercises executive power and the President must be able to control those who do. The words are still in the statute, as you saw in Walkthrough 2. They can no longer be enforced. This area of law is still unfolding.","alt":"The padlock's shackle swings open. The label changes to removal at will, Trump v. Slaughter, 2026."},{"n":7,"cam":[0,0,0],"text":"The President also directs agencies in writing, through executive orders. Think of an executive order as a management order, like a manager telling employees what to do: you follow it because you work there, and it reaches no one else. It binds the executive branch, not the public, and it must rest on the Constitution or a statute. It cannot give an agency power that Congress did not.","alt":"A document labeled Executive order travels down the shaft into the FTC."},{"n":8,"cam":[0,0,0],"text":"Remember the promise from Walkthrough 3? Before an agency publishes a significant rule, the President's office reviews it, through an office called OIRA. Independent agencies like the FTC were long left out of that review. A 2025 executive order brought them in.","alt":"A box beside the President, labeled White House review, OIRA. A draft rule travels up from the FTC to the box and back."},{"n":9,"cam":[0,0,0],"text":"Now Congress. Its first hand is the statute itself. Congress built the FTC, and Congress can widen its belt, narrow it, or take it away. If Congress repeals an enabling statute, the agency's power to act under it stops.","alt":"Congress and its blue belt stamped Statutes running to the FTC. Then a repeal mark cuts the belt, it fades, and the FTC's gears stop."},{"n":10,"cam":[0,0,0],"text":"Its second hand is money. An agency can spend only what Congress provides through appropriations. No money, no motion. Congress can also attach conditions that forbid spending on a particular project.","alt":"The statutes belt is restored and a green belt stamped Appropriations joins it. It dims, the gears stop, and then it returns."},{"n":11,"cam":[0,0,0],"text":"Its third hand is watching. In oversight hearings, Congress calls commissioners in to answer questions. And under the Congressional Review Act, Congress can vote to disapprove a new rule. If the President signs, the rule is void. In this series that is a block: a political branch stops an action. Courts never throw blocks. They cut.","alt":"Figures below Congress labeled oversight hearing. Then a block flies from Congress and lands on the FTC's rule belt, labeled block, Congressional Review Act. The belt and the companies' gear stop."},{"n":12,"cam":[0,0,0],"text":"The third branch you met in Walkthroughs 5 and 6. Article III courts cut belts that are unlawful. But a court waits for the right case, and it asks whether the agency broke the law, not whether it chose well.","alt":"The Article III courts casing appears below the companies, joined by a dashed road. A cut mark appears on the rule belt."},{"n":13,"cam":[0,0,0],"text":"And one hand is outside the government: the public. Voters choose the members of Congress and the President. Anyone can comment on a proposed rule during notice and comment, petition an agency to write, change, or repeal a rule, or simply write to any part of the government. And under the Freedom of Information Act, or FOIA, anyone can ask an agency for its records. FOIA reaches agencies, not Congress or the courts.","alt":"A row of figures below everything, labeled the public: anyone may write to any part of the government. Three dashed paths rise from it: votes to Congress, votes to the President, and to the FTC, comments in notice and comment, petitions and letters, and FOIA requests for records."},{"n":14,"cam":[0,0,0],"text":"So what is left of \"independent\"? The FTC still has five members, staggered terms, and a limit on how many can come from one party. But its leaders can now be removed at will. How much independence remains, there and at other agencies, is one of the most contested questions in administrative law.","alt":"The FTC with the open padlock above it. Below: still there, five members, staggered terms, party balance, and in red, gone, protection from removal."},{"n":15,"cam":[0,0,0],"text":"Here, for the first time, is the whole machine. Government is one very complex machine made of many smaller machines, and they are all connected. Congress sends the statutes and the money. The President appoints, removes, and directs. The agency writes rules and issues orders. Article III courts cut what is unlawful. And outside the box, the public votes, comments, and asks to see the records.","alt":"A bounded box labeled the federal government encloses Congress, the President, the FTC, and the Article III courts. The companies and the public are outside it. The parts light up in turn: Congress and its two belts, the President and the shaft, the courts, then the public and its three paths. A legend explains the lines: belt, a legal document carrying power across a boundary; shaft, control inside one branch; dashed, a path people or papers travel, carrying no legal power."},{"n":16,"cam":[0,0,0],"text":"So the agency is not a fourth branch that answers to no one. It sits in the executive branch, and every branch has a hand on it. You have now seen every part. Open the simulation and try them.","alt":"The whole machine. The caption, a fourth branch?, is struck through. The list of terms from this walkthrough appears."},{"n":17,"cam":[0,0,0],"text":"One last thing about the machine. It shows where power may flow, and that when power crosses a boundary something must be written down. It does not show what happens inside a gear casing. Every gear is people: commissioners who disagree, staff who draft and redraft, judges who read a word two ways. Administrative law and operations are vastly more complicated and interesting than any reductionist model can convey, but let's take this machine analogy as our starting point as we build a more complex mental model throughout the semester.","alt":"The whole machine, unchanged, every part lit. Nothing new appears; the picture simply holds."}],"practice":[{"type":"cat","prompt":"Sort each tool by the branch that holds it.","cats":["Congress","The President","Article III courts"],"items":[["Appropriations",0],["Oversight hearings",0],["Disapproving a rule under the Congressional Review Act",0],["Nominating commissioners",1],["Removing commissioners",1],["Executive orders",1],["Setting aside an unlawful rule",2]],"fb":"Every branch has a hand on the agency. Confirming commissioners is a hand the Senate shares with the President."},{"type":"mc","prompt":"After Trump v. Slaughter (2026), may the President remove an FTC commissioner without giving a reason?","options":["Yes. The Court held the for-cause limit unconstitutional","No. The FTC Act still allows removal only for cause","Only if the Senate agrees","Only if an Article III court approves first"],"answer":0,"fb":"The words are still in the FTC Act, but the Court overruled Humphrey's Executor and held that the limit cannot be enforced."},{"type":"mc","prompt":"True or false: an executive order can give an agency power that no statute gives it.","options":["True","False"],"answer":1,"fb":"An executive order directs the executive branch. It must rest on the Constitution or a statute, and only Congress can hand an agency new power."},{"type":"mc","prompt":"In this series, what is the difference between a shaft and a belt?","options":["A shaft is control inside one branch. A belt carries power across a boundary between bodies","A shaft is for rules. A belt is for orders","A shaft comes from Congress. A belt comes from the President","There is no difference"],"answer":0,"fb":"The President's control of the FTC is a shaft, because both are in the executive branch. A statute from Congress is a belt."},{"type":"cat","prompt":"Block or cut?","cats":["Block: a political branch stops an action","Cut: a court removes a belt that exists"],"items":[["Congress disapproves a new rule under the Congressional Review Act",0],["An Article III court sets aside an order as arbitrary and capricious",1],["An Article III court holds a rule ultra vires",1]],"fb":"Courts never throw blocks. They cut, and only when a case is brought to them."},{"type":"multi","prompt":"Which of these can the public do? Select all that apply.","options":[["Comment on a proposed rule",true],["Petition an agency to write, change, or repeal a rule",true],["Vote for the President and members of Congress",true],["Ask an agency for its records under FOIA",true],["Remove a commissioner directly",false]],"fb":"The public's hand is indirect, but it reaches every other hand."}]}];

/**

 */
function call(fn, args, ok, fail) {
  if (!PREVIEW) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || function (e) { showError(e.message || String(e)); }); r[fn].apply(r, args); return; }

/* v0.38, public build only: finished walkthroughs are kept in this browser's localStorage, so a reader who
   comes back sees what they finished, and nobody else ever does. Every read and write is wrapped, because
   storage can be unavailable (private windows, strict settings) and the page must work without it. */
var PUBLIC_KEY = 'gbb-public-done';
function publicDone_() { try { return JSON.parse(localStorage.getItem(PUBLIC_KEY) || '[]'); } catch (e) { return []; } }
function publicRemember_(n) { try { var d = publicDone_(); if (d.indexOf(n) === -1) { d.push(n); localStorage.setItem(PUBLIC_KEY, JSON.stringify(d)); } } catch (e) {} }

/**
 * Draws the small picture at the top of the home page (added v0.17): Congress's
 * gears, the COPPA belt to the FTC, the COPPA Rule belt to a company's sign-up
 * screen, and the question "Are you 13 or older?". It previews Walkthrough 1 with the
 * same Civic Poster kit the lessons use. Gears turn and belts run; the CSS rule
 * for prefers-reduced-motion stops all of it for students who ask for less motion.
 * A text description for screen readers is set on the container in home().
 * @return {string} SVG markup, 1500 x 460 units, scaled to the page width.
 */
/**
 * The machine as a picture, for the home page (v0.33; replaces heroSim() from v0.25). The simulation's
 * drawing code binds to element ids, so it is run once on a hidden copy of its template, the drawn SVG is
 * copied out as text, and the hidden copy is removed. The copy is then made inert: ids stripped so nothing
 * on the page shares one, and every part's tabindex, role, and label removed so a keyboard user does not
 * tab through nineteen buttons that answer to nothing. Pointer events are turned off in CSS. The gears still
 * turn, because that is a CSS animation on a class the snapshot keeps. The legend stays, since it explains
 * the belt colours; the panel, tabs, and notes do not, because they belong to the simulation page.
 * @return {string} HTML: the figure (SVG plus legend) inside a .simroot wrapper so its styles apply.
 */
function heroMachine() {
  var hidden = document.createElement('div');
  hidden.setAttribute('aria-hidden', 'true');
  hidden.style.cssText = 'position:absolute;left:-99999px;top:0;width:1200px;overflow:hidden';
  hidden.innerHTML = E('simtpl').innerHTML;
  document.body.appendChild(hidden);
  var html = '';
  try {
    runSim();
    var fig = hidden.querySelector('.fig');
    /* The court's cut marker (#block) is hidden by an id-based CSS rule until a cut happens. Stripping ids
       below would un-hide it at the SVG origin, so it is removed first: a still overview has no cut to mark. */
    var mark = fig.querySelector('#block'); if (mark) mark.parentNode.removeChild(mark);
    Array.prototype.forEach.call(fig.querySelectorAll('[id]'), function (el) { el.removeAttribute('id'); });
    Array.prototype.forEach.call(fig.querySelectorAll('[tabindex],[role],[aria-label]'), function (el) {
      el.removeAttribute('tabindex'); el.removeAttribute('role'); el.removeAttribute('aria-label'); });
    fig.setAttribute('aria-hidden', 'true');
    html = '<div class="simroot">' + fig.outerHTML + '</div>';
  } finally { document.body.removeChild(hidden); }
  return html;
}

function heroSvg() {
  // The kit's 'vars' theme maps every colour to a CSS variable so the picture follows the light or dark theme.
  // Each walkthrough builder defines TOKENS.vars when it runs; the home page can draw before any builder has run,
  // so it defines the same mapping here. Keep all eight copies identical (a later cleanup could define it once).
  TOKENS.vars = { paper:'var(--gbb-paper)', panel:'var(--gbb-panel)', ink:'var(--gbb-ink)', inkSoft:'var(--gbb-ink-soft)',
    rule:'var(--gbb-rule)', gear:'var(--gbb-gear)', signal:'var(--gbb-signal)',
    belt:{ enabling:'var(--gbb-enabling)', approp:'var(--gbb-approp)', agency:'var(--gbb-agency)', state:'var(--gbb-state)' } };
  var k = createKit({ theme: 'vars', weight: 'poster', idPrefix: 'hero' }), T = k.tokens, SANS = FONTS.sans;
  var tx = function (x, y, str, size, fill, weight) { return k.text(x, y, str, size, fill || T.ink, SANS, 'middle', weight || '700'); };
  var CY = 220;
  var h = k.defs();
  // Belts first, so the casings sit on top of the belt ends.
  h += k.belt({ x1: 360, y1: CY, x2: 610, y2: CY, kind: 'enabling', title: 'COPPA (1998)', travel: true });
  h += k.belt({ x1: 860, y1: CY, x2: 1150, y2: CY, kind: 'agency', title: 'COPPA Rule', travel: true });
  // Congress: one large gear meshing with two small ones, as in Walkthrough 1.
  var a = k.meshCenter(190, 185, 96, 46, 135), b = k.meshCenter(190, 185, 96, 46, 45);
  h += k.casing({ x: 30, y: 50, w: 330, h: 360, name: 'Congress', size: 34 });
  h += k.gear({ cx: 190, cy: 185, r: 96, spin: true }) + k.gear({ cx: a[0], cy: a[1], r: 46, spin: true, ccw: true }) + k.gear({ cx: b[0], cy: b[1], r: 46, spin: true, ccw: true });
  // The FTC: the agency that received the belt and wrote the rule.
  h += k.casing({ x: 610, y: 95, w: 250, h: 270, name: 'FTC', size: 34 });
  h += k.gear({ cx: 735, cy: 205, r: 78, spin: true, ccw: true });
  // The company's sign-up screen, where the rule reaches the student.
  h += '<rect x="1150" y="40" width="210" height="380" rx="4" fill="' + T.panel + '" stroke="' + T.ink + '" stroke-width="8"/>';
  h += '<rect x="1215" y="58" width="80" height="8" fill="' + T.ink + '"/>';
  h += tx(1255, 175, 'Are you 13', 30) + tx(1255, 213, 'or older?', 30);
  h += '<rect x="1178" y="262" width="154" height="54" fill="' + T.ink + '"/>' + tx(1255, 298, 'Yes', 24, T.paper);
  h += '<rect x="1178" y="330" width="154" height="54" fill="none" stroke="' + T.ink + '" stroke-width="4"/>' + tx(1255, 366, 'No', 24);
  h += tx(1255, 438, 'Your screen', 20, T.inkSoft, '700');
  return '<svg viewBox="0 0 1500 460" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' + h + '</svg>';
}

/**
 * Deep links (added v0.17): a link ending in ?s=6 opens Walkthrough 6 directly, and
 * ?s=sim opens the simulation, so an email can send a reader straight to one
 * lesson. In Apps Script the page runs inside Google's frame, so the address is

 * location.search. Any other value, or none, opens the home page.
 * @param {Function} cb  Called with the requested value as a string, or ''.

function readDeepLink(cb) {

  try { google.script.url.getLocation(function (loc) { cb(String((loc && loc.parameter && loc.parameter.s) || '')); }); }
  catch (err) { cb(''); } // if Google's helper is unavailable, fall back to the home page
}

/* Builds the HTML for a walkthrough's practice questions. */
function practiceHtml(qs) {
  return qs.map(function (q, i) { var h = '<div class="pq" data-i="' + i + '"><h3>' + (i + 1) + '. ' + escH(q.type === 'blank' ? 'Fill in the blanks.' : q.prompt) + '</h3>';
    if (q.type === 'cat') h += q.items.map(function (it, k) { return '<div class="row2"><span style="min-width:150px;font-weight:600">' + escH(it[0]) + '</span><select aria-label="Category for ' + escH(it[0]) + '" data-k="' + k + '"><option value="">Choose</option>' + q.cats.map(function (c, ci) { return '<option value="' + ci + '">' + escH(c) + '</option>'; }).join('') + '</select></div>'; }).join('');
    if (q.type === 'order') h += '<div class="ordlist"></div>';
    if (q.type === 'num') h += '<input type="number" aria-label="Your answer" inputmode="numeric">';
    if (q.type === 'mc') h += q.options.map(function (o, k) { return '<label class="opt"><input type="radio" name="pq' + i + '" value="' + k + '"><span>' + escH(o) + '</span></label>'; }).join('');
    if (q.type === 'multi') h += q.options.map(function (o, k) { return '<label class="opt"><input type="checkbox" value="' + k + '"><span>' + escH(o[0]) + '</span></label>'; }).join('');
    if (q.type === 'blank') h += '<p style="line-height:2.5">' + escH(q.prompt).replace(/\{(\d)\}/g, function (m, d) { return '<select aria-label="Blank ' + (+d + 1) + '" data-b="' + d + '"><option value="">Choose</option>' + q.bank.map(function (w) { return '<option>' + escH(w) + '</option>'; }).join('') + '</select>'; }) + '</p>';
    return h + '<div class="row2"><button class="btn" type="button" data-check="' + i + '">Check my answer</button><button class="btn" type="button" data-show="' + i + '" hidden>Show the answer</button></div><div class="res" hidden></div></div>'; }).join('');
}
/* Hides a question's result so the student can try again. */
function clearResult(box) { var r = box.querySelector('.res'); r.hidden = true; r.innerHTML = ''; box.querySelector('[data-show]').hidden = true; }
/* Draws an ordering question's list with up and down buttons; when marked, shows which items are in place. */
function drawOrder(q, box, marked) { var list = box.querySelector('.ordlist');
  list.innerHTML = q._cur.map(function (v, pos) { return '<div class="ord' + (marked ? (v === pos ? ' ok' : ' bad') : '') + '"><b class="ui">' + (pos + 1) + '</b><span>' + escH(q.items[v]) + '</span>' + (marked ? '<em class="badge ui">' + (v === pos ? 'in place' : 'move this') + '</em>' : '') + '<button class="mini" type="button" data-up="' + pos + '" aria-label="Move up"' + (pos === 0 ? ' disabled' : '') + '>Up</button><button class="mini" type="button" data-dn="' + pos + '" aria-label="Move down"' + (pos === q._cur.length - 1 ? ' disabled' : '') + '>Down</button></div>'; }).join('');
  Array.prototype.forEach.call(list.querySelectorAll('[data-up],[data-dn]'), function (b) { b.onclick = function () { var up = b.hasAttribute('data-up'), p = +(b.getAttribute(up ? 'data-up' : 'data-dn')), o = up ? p - 1 : p + 1, tmp = q._cur[p]; q._cur[p] = q._cur[o]; q._cur[o] = tmp; clearResult(box); drawOrder(q, box); }; });
}
/* Wires up Check and Show buttons for each practice question and grades answers in the browser. */
/**
 * Wires the Check and Show buttons for a walkthrough's practice questions and grades answers in the
 * browser. From v0.26 it also tracks progress (see progress_ below): walkthroughN is the walkthrough these
 * questions belong to, so a finished set can be reported against the right one. walkthroughN is
 * optional; omitting it (as nothing in this file does) simply skips progress tracking.
 * @param {Object[]} qs  This walkthrough's practice questions, from TRIPS.
 * @param {number=} walkthroughN  The walkthrough number, for progress tracking.
 */
function bindPractice(qs, walkthroughN) {
  // v0.26: per-question state for progress tracking. done: has this question been resolved, by a
  // correct check or by Show Answer. firstTry: was the first Check attempt correct (null until tried).
  var pstate = qs.map(function () { return { done: false, firstTry: null, attempts: 0 }; });
  qs.forEach(function (q, i) { var box = app.querySelector('.pq[data-i="' + i + '"]'), res = box.querySelector('.res');
    if (q.type === 'order') { q._cur = q.items.map(function (_, k) { return (k * 2 + 3) % q.items.length; }); drawOrder(q, box); }
    function right() {
      if (q.type === 'cat') return q.items.every(function (it, k) { return box.querySelector('[data-k="' + k + '"]').value === String(it[1]); });
      if (q.type === 'order') return q._cur.every(function (v, k) { return v === k; });
      if (q.type === 'num') return Number(box.querySelector('input').value) === q.answer;
      if (q.type === 'mc') { var c = box.querySelector('input:checked'); return !!c && +c.value === q.answer; }
      if (q.type === 'multi') return q.options.every(function (o, k) { return box.querySelector('input[value="' + k + '"]').checked === o[1]; });
      if (q.type === 'blank') return q.answers.every(function (a, k) { return box.querySelector('[data-b="' + k + '"]').value === a; }); }
    function reveal() {
      if (q.type === 'cat') q.items.forEach(function (it, k) { box.querySelector('[data-k="' + k + '"]').value = String(it[1]); });
      if (q.type === 'order') { q._cur = q.items.map(function (_, k) { return k; }); drawOrder(q, box, true); }
      if (q.type === 'num') box.querySelector('input').value = q.answer;
      if (q.type === 'mc') box.querySelector('input[value="' + q.answer + '"]').checked = true;
      if (q.type === 'multi') q.options.forEach(function (o, k) { box.querySelector('input[value="' + k + '"]').checked = o[1]; });
      if (q.type === 'blank') q.answers.forEach(function (a, k) { box.querySelector('[data-b="' + k + '"]').value = a; }); }
    /**
     * v0.34: the student's current answer, in words, for the Answers tab. Option and item texts are
     * used rather than indexes so the sheet reads without the question in front of you. Kept under
     * 500 characters by the server.
     */
    function describe() {
      if (q.type === 'mc') { var c = box.querySelector('input:checked'); return c ? q.options[+c.value] : '(no answer)'; }
      if (q.type === 'multi') { var on = q.options.filter(function (o, k) { return box.querySelector('input[value="' + k + '"]').checked; }).map(function (o) { return o[0]; }); return on.length ? on.join('; ') : '(none selected)'; }
      if (q.type === 'cat') return q.items.map(function (it, k) { var v = box.querySelector('[data-k="' + k + '"]').value; return it[0] + ' -> ' + (v === '' ? '(unsorted)' : q.cats[+v]); }).join('; ');
      if (q.type === 'order') return q._cur.map(function (v) { return q.items[v]; }).join(' > ');
      if (q.type === 'num') return box.querySelector('input').value || '(blank)';
      if (q.type === 'blank') return q.answers.map(function (a, k) { return box.querySelector('[data-b="' + k + '"]').value || '(blank)'; }).join(' | ');
      return '';
    }
    /** v0.34: sends one answer to the Answers tab. Skipped silently when there is no walkthrough number. */
    function recordAnswer(answer, ok) {
      if (!walkthroughN) return;
      pstate[i].attempts += 1;
      call('submitAnswer', [walkthroughN, i + 1, q.type, answer, ok, pstate[i].attempts], function () {});
    }
    function progress() {
      if (q.type === 'order') { var n = q._cur.filter(function (v, k) { return v === k; }).length; return ' ' + n + ' of ' + q._cur.length + ' are in the right place. The marked rows show which.'; }
      if (q.type === 'cat') { var m = q.items.filter(function (it, k) { return box.querySelector('[data-k="' + k + '"]').value === String(it[1]); }).length; return ' ' + m + ' of ' + q.items.length + ' are sorted correctly.'; }
      return ''; }
    box.querySelector('[data-check]').onclick = function () { var ok = right(); res.hidden = false; res.className = 'res' + (ok ? '' : ' no');
      if (q.type === 'order') drawOrder(q, box, true);
      res.innerHTML = ok ? '<b class="ui">Correct.</b> ' + escH(q.fb) : '<b class="ui">Not yet.</b>' + progress() + ' Change your answer and check again, or show the answer.'; box.querySelector('[data-show]').hidden = ok;
      recordAnswer(describe(), ok); // v0.34: every Check is recorded, right or wrong.
      // v0.26: the first Check on this question decides its first-try result; later re-checks don't change that.
      if (pstate[i].firstTry === null) pstate[i].firstTry = ok;
      if (ok) { pstate[i].done = true; reportProgress_(); } };
    box.addEventListener('change', function () { clearResult(box); }); box.addEventListener('input', function () { clearResult(box); });
    box.querySelector('[data-show]').onclick = function () { reveal(); res.hidden = false; res.className = 'res'; res.innerHTML = '<b class="ui">Answer shown.</b> ' + escH(q.fb); this.hidden = true;
      recordAnswer('(showed the answer)', false); // v0.34
      // v0.26: showing the answer also resolves the question (as not first-try-correct, unless it already was).
      if (pstate[i].firstTry === null) pstate[i].firstTry = false;
      pstate[i].done = true; reportProgress_(); };
  });
  /**
   * v0.26: once every question in this set has been resolved (answered correctly, or shown), sends
   * one summary to the server: how many were right on the first try, out of how many. Fires once per
   * visit, the moment the set becomes fully resolved; later Check clicks on already-resolved questions
   * don't resend it.
   */
  var reported = false;
  function reportProgress_() {
    if (reported || !walkthroughN || !qs.length) return;
    if (!pstate.every(function (s) { return s.done; })) return;
    reported = true;
    var firstTryCorrect = pstate.filter(function (s) { return s.firstTry === true; }).length;
    call('submitProgress', [walkthroughN, firstTryCorrect, qs.length], function () {});
    // v0.35: remember it on the page too, so the home page greys this walkthrough without a reload.
    if (S) { S.done = S.done || []; if (S.done.indexOf(walkthroughN) === -1) S.done.push(walkthroughN); }
    if (PUBLIC) publicRemember_(walkthroughN); // v0.38: and in this browser, for next time
  }
}

/* ---------------- a trip: one continuous page ---------------- */
/**
 * The part of a lesson page that comes after the lesson itself, shared by the scrolling
 * view and reading mode (v0.19): the term list, the cases and statutes list, the
 * practice questions, and the buttons out.
 * @param {Object} t  The walkthrough's entry in TRIPS.
 * @param {Object} nextT  The next walkthrough that is built, or undefined.
 * @return {string} HTML.
 */
function lessonTail(t, nextT) {
  var qs = t.practice || [], lis = t.terms.map(function (x) { return '<li>' + escH(x) + '</li>'; }).join('');
  return '<section class="after"><h2>Terms from this walkthrough</h2><ul class="termlist">' + lis + '</ul>' +
    (t.authorities ? '<h2>Cases and statutes</h2><p class="note">This is a fast-moving area of law. These are the sources behind this walkthrough, in Bluebook form.</p><ol class="authlist">' + t.authorities.map(function (a) { return '<li>' + a + '</li>'; }).join('') + '</ol>' : '') +
    (qs.length ? '<h2>Practice questions</h2><p class="note">' + (PUBLIC ? 'These ' + qs.length + ' questions check themselves on this page. This is the public beta: nothing you enter is saved. Feedback is welcome at haquer@wfu.edu.' : 'These ' + qs.length + ' questions are not for a grade. Your answers are recorded, and Prof. Haque can see them, to help her prepare for class. They may help you with the quiz you will take in class.') + '</p><div class="card">' + practiceHtml(qs) + '</div>' : '') +
    '<div class="nextrow"><button class="btn primary" type="button" id="tosim">Explore the simulation</button>' + (nextT ? '<button class="btn" type="button" id="tonext">Next: ' + escH(nextT.shortName || ('Walkthrough ' + nextT.n)) + '</button>' : '') + '<button class="btn" type="button" id="topath">Back to your path</button></div></section>';
}

/**
 * Wires the buttons that both views share.
 * @param {Object} t  The walkthrough's entry in TRIPS.
 * @param {Object} nextT  The next walkthrough that is built, or undefined.
 */
function bindLessonTail(t, nextT) {
  E('tosim').onclick = function () { go(simView); };
  E('topath').onclick = function () { go(home); };
  if (nextT) E('tonext').onclick = function () { go(function () { lesson(nextT.n); }); };
  bindPractice(t.practice || [], t.n); // v0.26: t.n lets progress be reported against the right walkthrough.
}

/**
 * Reading mode (v0.19): the same lesson as an ordinary article. Every step appears in order,
 * each with a still picture of that step drawn by the walkthrough's own drawing function, so there
 * is no second copy of the content to keep in step. Nothing moves and nothing depends on
 * scrolling. Added after a colleague found the scrolling version visually distracting, and it
 * is what anyone whose browser asks for reduced motion sees first.
 * Each picture is marked aria-hidden unless its beat carries an alt description, because the
 * step's words are beside it and an undescribed picture is noise to a screen reader. Writing
 * an alt line per beat, from the "On the picture" column of the Series Plan, is an open item.
 * @param {number} n  Walkthrough number, 1 to 7.
 */
function reading(n) {
  setNav(''); var t = TRIPS.filter(function (x) { return x.n === n; })[0];
  CTX = { page: 'Walkthrough ' + n + ' (reading mode): ' + t.title };
  var after = TRIPS.slice(TRIPS.indexOf(t) + 1), nextT = after.filter(function (x) { return x.build; })[0];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var beats = t.beats, body = '';
  beats.forEach(function (b, k) {
    body += '<section class="rstep"><h3>Step ' + b.n + ' of ' + beats.length + '</h3>' +
      '<figure><svg class="rfig" data-i="' + k + '" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"' +
      (b.alt ? ' role="img" aria-label="' + escH(b.alt) + '"' : ' aria-hidden="true" focusable="false"') + '></svg></figure>' +
      '<p>' + escH(b.text) + '</p></section>';
  });
  app.innerHTML = '<section class="hero"><p class="kicker">' + escH(t.kicker || ('Walkthrough ' + n + ' of 7')) + '</p><h1>' + escH(t.title) + '</h1>' +
    '<p class="lead">' + escH(t.intro) + '</p>' +
    '<div class="modeswitch"><button class="btn" type="button" id="toscroll">Show the scrolling version</button>' +
    '<span class="note">Reading mode: the same lesson as an article, with nothing moving.' + (reduce ? ' Your browser asks for reduced motion, so this is the version you see first.' : '') + '</span></div>' +
    '<p class="note">' + escH(t.version) + ' Draft content: facts still need verification before students use it.</p></section>' +
    '<div class="readwrap">' + body + '</div>' + lessonTail(t, nextT);
  /* Drawing the stills. The drawing functions look their parts up by element id, so seventeen live
     copies on one page would collide. Instead one hidden stage is built, each step is rendered into
     it in turn, and a snapshot of the result is kept as text. The hidden stage is then removed and
     the snapshots are placed in the figures with their ids stripped, so nothing on the page shares
     an id and no script runs afterwards. The hidden stage also carries the term panel the drawing
     functions expect to find. */
  var hidden = document.createElement('div');
  hidden.setAttribute('aria-hidden', 'true');
  hidden.style.cssText = 'position:absolute;left:-99999px;top:0;width:1280px;height:720px;overflow:hidden';
  hidden.innerHTML = '<svg id="w" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"></svg><div id="terms"><div class="tc"><ul></ul></div></div>';
  document.body.appendChild(hidden);
  var stage = hidden.querySelector('#w'), shots = [];
  try {
    var api = window[t.build](stage, JSON.parse(JSON.stringify(t.beats)));
    beats.forEach(function (b, k) {
      api.render(k, 0.98);
      shots.push({ view: stage.getAttribute('viewBox'), html: stage.innerHTML.replace(/\sid="[^"]*"/g, '') });
    });
  } finally { document.body.removeChild(hidden); }
  Array.prototype.slice.call(app.querySelectorAll('.rfig')).forEach(function (fig, k) {
    if (!shots[k]) return;
    fig.setAttribute('viewBox', shots[k].view); fig.innerHTML = shots[k].html;
  });
  E('toscroll').onclick = function () { go(function () { lesson(n, true); }); };
  bindLessonTail(t, nextT);
  call('logEvent', ['opened walkthrough ' + n + ' (reading mode)'], function () {});
  unmount = null;
}

/**
 * Draws walkthrough n as one continuous page: the intro, the pinned picture with
 * the step cards beside it, the term list, any case list, the practice
 * questions, and buttons to the simulation and the next walkthrough.
 * Scroll position drives the picture: each animation frame measures which
 * step card is at 62 percent of the screen height and calls that walkthrough's
 * render(step, progress). With reduced motion on, jumps are not smoothed.
 * @param {number} n  Walkthrough number, 1 to 7.
 */
function lesson(n, force) {
  var wantsLess = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // v0.19: reduced motion gets reading mode first, unless the student asked for this view from there.
  if (wantsLess && !force) return reading(n);
  setNav(''); CTX = { page: 'Walkthrough ' + n + ': ' + TRIPS.filter(function (x) { return x.n === n; })[0].title };
  var t = TRIPS.filter(function (x) { return x.n === n; })[0], after = TRIPS.slice(TRIPS.indexOf(t) + 1), nextT = after.filter(function (x) { return x.build; })[0], qs = t.practice || [];
  var lis = t.terms.map(function (x) { return '<li>' + escH(x) + '</li>'; }).join('');
  app.innerHTML = '<section class="hero"><p class="kicker">' + escH(t.kicker || ('Walkthrough ' + n + ' of 7')) + '</p><h1>' + escH(t.title) + '</h1><p class="lead">' + escH(t.intro) + '</p><p><button class="btn primary" id="begin" type="button">' + 'Begin the walkthrough' + '</button> <button class="btn" type="button" id="toread">Read this instead</button></p><p class="note">' + escH(t.version) + ' Draft content: facts still need verification before students use it.</p></section>' +
    '<div class="walkthrough"><div class="pin"><div class="stage"><svg id="w" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"></svg><p class="sr" id="wdesc"></p>' +
    '<div id="terms"><div class="tc"><h2>Terms from this walkthrough</h2><ul>' + lis + '</ul></div></div></div><div class="meter ui"><span id="where"></span><span class="track"><i id="prog"></i></span><span class="more" id="more" aria-hidden="true">Keep scrolling <b class="chev">↓</b></span></div></div><div class="story" id="story"></div></div>' +
    lessonTail(t, nextT);
  var api = window[t.build](E('w'), JSON.parse(JSON.stringify(t.beats))), BEATS = api.BEATS, render = api.render, story = E('story');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches, clamp = function (v) { return Math.max(0, Math.min(1, v)); };
  BEATS.forEach(function (b) { var tx = escH(b.text);
    (t.cardTerms[b.n] || []).forEach(function (w) { var pre = '', find = w; if (w.indexOf('>') > -1) { var q = w.split('>'); find = q[0]; pre = q[1].split('|')[0]; w = q[1].split('|')[1]; } tx = tx.replace(new RegExp('\\b' + find + '\\b'), pre + '<span class="term">' + w + '</span>'); });
    ((t.cardItalic || {})[b.n] || []).forEach(function (w) { tx = tx.split(w).join('<i>' + w + '</i>'); });
    var words = b.text.split(/\s+/).length, sec = document.createElement('section'); sec.className = 'step'; sec.style.minHeight = Math.round(Math.max(90, Math.min(150, 70 + words * 0.9))) + 'vh';
    sec.innerHTML = '<div class="scard"><b>Step ' + b.n + ' of ' + BEATS.length + '</b><p>' + tx + '</p></div>'; story.appendChild(sec); });
  var steps = Array.prototype.slice.call(story.querySelectorAll('.step')), shown = { i: 0, p: 0 }, target = { i: 0, p: 0 }, alive = true;
  function measure() { var anchor = window.innerHeight * 0.62, i = 0, p = 0;
    for (var k = 0; k < steps.length; k++) { var r = steps[k].getBoundingClientRect(); if (r.top <= anchor) { i = k; p = clamp((anchor - r.top) / r.height); } }
    target.i = i; target.p = reduce ? .72 : p; }
  function frame() { if (!alive) return; measure();
    if (reduce || shown.i !== target.i) { shown.i = target.i; shown.p = target.p; } else { shown.p += (target.p - shown.p) * 0.18; if (Math.abs(target.p - shown.p) < 0.0008) shown.p = target.p; }
    render(shown.i, shown.p); E('prog').style.width = ((shown.i + shown.p) / BEATS.length * 100) + '%'; E('where').textContent = 'Step ' + BEATS[shown.i].n + ' of ' + BEATS.length;
    // v0.27: hide the keep-scrolling cue once there is nothing left to scroll to.
    E('more').classList.toggle('done', shown.i === BEATS.length - 1 && shown.p > .97);
    steps.forEach(function (s, k) { s.classList.toggle('on', k === shown.i); });
    /* v0.23: the scrolling view keeps a hidden description of the current step's picture, for screen readers,
       for any beat that carries an alt line. The picture itself stays aria-hidden. */
    var alt = BEATS[shown.i].alt || ''; if (E('wdesc') && E('wdesc').textContent !== alt) E('wdesc').textContent = alt;
    requestAnimationFrame(frame); }
  E('begin').onclick = function () { steps[0].scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); };
  E('toread').onclick = function () { go(function () { reading(n); }); };
  bindLessonTail(t, nextT);
  window.__seek = function (i, p) { var r = steps[i].getBoundingClientRect(); window.scrollTo(0, window.scrollY + r.top + r.height * p - window.innerHeight * 0.62); };
  render(0, 0); requestAnimationFrame(frame); call('logEvent', ['opened walkthrough ' + n], function () {});
  unmount = function () { alive = false; };
}

/* ---------------- the simulation ---------------- */
/* Draws the simulation from its template element and starts it. */
function simView() {
  setNav('sim'); CTX = { page: 'Simulation' }; app.innerHTML = ''; app.appendChild(E('simtpl').content.cloneNode(true)); runSim();
  var row = document.createElement('div'); row.className = 'pad'; row.style.paddingTop = '0';
  row.innerHTML = '<div class="nextrow"><button class="btn" type="button" id="simback">Back to your path</button></div>'; app.appendChild(row);
  E('simback').onclick = function () { go(home); }; call('logEvent', ['opened simulation'], function () {});
}

/* ---------------- peer test: a feedback form on every page ---------------- */
/* Describes where the student is (page, step, or Diagnose mode) so each feedback note says where it came from. */
function currentPlace() { var w = E('where'), place = CTX.page;
  if (w && w.textContent && CTX.page.indexOf('Walkthrough') === 0) { var after = document.querySelector('.after');
    place += (after && after.getBoundingClientRect().top < window.innerHeight * .6) ? ' (terms and practice questions)' : ' (' + w.textContent + ')'; }
  if (CTX.page === 'Simulation') { var d = document.getElementById('tDiag'); if (d) place += d.getAttribute('aria-selected') === 'true' || d.classList.contains('on') ? ' (Diagnose)' : ''; }
  return place; }
/**
 * Peer test mode only: adds the thank-you banner, the red Feedback button,
 * and the feedback dialog. Notes go to submitFeedback in Code.gs. Escape
 * closes the dialog, and focus returns to the button, for keyboard users.
 */
function setupFeedback() {
  // v0.26: the banner is peer-test-only messaging, so it only appears while PeerTestMode is on.
  // The Feedback button itself, below, is created either way.
  if (S.peerTest) {
    var bn = document.createElement('div'); bn.className = 'peerbanner ui';
    bn.innerHTML = '<b>Peer test version.</b> Thank you for helping test this project. Any feedback for this page design? Use the <b>Feedback</b> button on any page.';
    document.body.insertBefore(bn, app);
  }
  var btn = document.createElement('button'); btn.type = 'button'; btn.id = 'fbbtn'; btn.className = 'ui'; btn.textContent = 'Feedback'; btn.setAttribute('aria-haspopup', 'dialog'); btn.setAttribute('aria-expanded', 'false');
  document.body.appendChild(btn);
  var pn = document.createElement('div'); pn.id = 'fbpanel'; pn.setAttribute('role', 'dialog'); pn.setAttribute('aria-labelledby', 'fbtitle'); pn.hidden = true;
  pn.innerHTML = '<div class="fbhead"><h2 id="fbtitle">Send feedback</h2><button type="button" id="fbx">Close</button></div>' +
    '<p class="fbthanks">Thank you for helping with this project. Your time and your eye make it better for every student who uses it.</p><p class="note" id="fbwhere"></p>' +
    '<fieldset><legend class="ui">What kind of note is this?</legend>' +
    ['Something didn\u2019t work', 'Something was confusing', 'Wording or a typo', 'A suggestion'].map(function (k, i) { return '<label class="opt"><input type="radio" name="fbkind" value="' + k + '"' + (i === 0 ? ' checked' : '') + '><span>' + k + '</span></label>'; }).join('') + '</fieldset>' +
    '<label for="fbtext" class="ui">Any feedback for this page design?</label><textarea id="fbtext" rows="5" placeholder="For example: I clicked Next and nothing happened. Or: step 6 was hard to follow."></textarea>' +
    '<p class="note">Your WFU email, this page, and your browser type are sent with your note, so Prof. Haque can follow up and reproduce the problem.</p>' +
    '<div class="row2"><button type="button" class="btn primary" id="fbsend">Send</button><span id="fbstatus" class="note" role="status"></span></div>';
  document.body.appendChild(pn);
  function open() { E('fbwhere').textContent = 'Page: ' + currentPlace(); E('fbstatus').textContent = ''; pn.hidden = false; btn.setAttribute('aria-expanded', 'true'); E('fbtext').focus(); }
  function close() { pn.hidden = true; btn.setAttribute('aria-expanded', 'false'); btn.focus(); }
  btn.onclick = function () { pn.hidden ? open() : close(); }; E('fbx').onclick = close;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pn.hidden) close(); });
  window.__fbClose = function () { if (!pn.hidden) { pn.hidden = true; btn.setAttribute('aria-expanded', 'false'); } };
  E('fbsend').onclick = function () { var txt = E('fbtext').value.trim(), st = E('fbstatus'), b = this;
    if (txt.length < 3) { st.textContent = 'Please write a few words first.'; E('fbtext').focus(); return; }
    var kind = (pn.querySelector('input[name="fbkind"]:checked') || {}).value || '';
    var payload = { page: E('fbwhere').textContent.replace(/^Page: /, ''), kind: kind, comment: txt, device: navigator.userAgent, screen: window.innerWidth + ' x ' + window.innerHeight };
    b.disabled = true; st.textContent = 'Sending\u2026';
    call('submitFeedback', [payload], function (r) { b.disabled = false; E('fbtext').value = '';
      st.textContent = (r && r.preview) ? 'Preview only: on the peer test site, this note goes to Prof. Haque\u2019s feedback sheet.' : 'Thank you. Your note was sent, and it helps a great deal. You can send another anytime.'; },
      function () { b.disabled = false; st.textContent = 'That did not send. Please try again, or email Prof. Haque.'; }); };
}
E('home').onclick = function () { if (S) go(home); }; E('navpath').onclick = function () { if (S) go(home); }; E('navsim').onclick = function () { if (S) go(simView); };
E('footthanks').onclick = function () { if (S) go(thanks); };
E('navthanks').onclick = function () { if (S) go(thanks); }; // v0.46: acknowledgements in the top navigation too
E('theme').onclick = function () { var r = document.documentElement, dark = r.getAttribute('data-theme') === 'dark'; r.setAttribute('data-theme', dark ? 'light' : 'dark'); this.textContent = dark ? 'Dark theme' : 'Light theme'; };
load();

</script>
