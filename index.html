=============================================================================
Prof. Haque's Administrative Law Scrollytelling: learning site, page side
File:     Index.html
Version:  site v0.47 (see README.md for the change log)
Created by Raina Haque. (c) 2026 Raina Haque.
May be used only with the express permission of Raina Haque.
=============================================================================

WHAT THIS FILE IS
  The entire student-facing site in one self-contained file: seven scroll
  lessons ("walkthroughs"), practice questions at the end of each,
  and the interactive simulation. It runs two ways:
    - Inside Google Apps Script (the real site). Code.gs serves it, and the
      page talks to Code.gs through google.script.run.
    - As a plain page (the claude.ai preview). With no Apps Script present,
      the page uses stand-in data; see PREVIEW in the SITE section.

MAP OF THE FILE, in order
  1. STYLE     Design tokens (colours, stroke weights, type) for the Civic
               Poster design system, light and dark, then page layout, the
               practice questions, the lesson layout, the peer test banner,
               and the simulation's own scoped styles.
  2. BODY      The header and an empty #app container. Every view is drawn
               into #app by script. The simulation's markup is a template element.
  3. SCRIPT    a. CIVIC POSTER KIT: createKit() returns functions that draw
                  gears, casings, belts, seals, and labels as SVG strings.
               b. WALKTHROUGH BUILDERS: one function per walkthrough (table below).
                  Each draws that walkthrough's picture once, then returns
                  render(step, progress), which the page calls as the
                  student scrolls.
               c. SIMULATION: runSim() and its helpers (Explore and Diagnose).
               d. SITE: the TRIPS data (every walkthrough's text, terms, cases,
                  and practice questions), the home page, the lesson page,
                  the practice checker, and the peer test feedback form.

NAMING NOTE FOR AUDITORS: builder names are historical
  The series was first called "trips" and was renumbered when the statute
  lesson was added. The builder function names were kept so nothing broke.
  The TRIPS array's "build" field is the source of truth for the mapping:
      Walkthrough 1  Why does the website ask if you are 13?          buildTrip1
      Walkthrough 2  What does the statute actually say?              buildGuide1
      Walkthrough 3  How did the agency write that rule?              buildTrip2
      Walkthrough 4  What happens when a company ignores the rule?    buildTrip3
      Walkthrough 5  Can the company get into court?                  buildTrip4
      Walkthrough 6  What does the court inspect, and what can it do? buildTrip6
      Walkthrough 7  Who controls the agency?                         buildTrip7
  Section banners inside a builder may still say "TRIP n WORLD" in the old
  numbering. Students never see these names.

WHAT IS STORED, AND WHERE
  Nothing about a student's work leaves the browser. Practice answers are
  checked here and discarded. The only calls to the server are: load the
  page data, log that a page was opened, send a peer test note, and (for
  instructors) fetch the settings Sheet's link. See Code.gs.

COMMENTING STATUS
  DEEP LINKS (v0.17): add ?s=1 to ?s=7 to the /exec address to open that
  walkthrough directly, or ?s=sim for the simulation. See readDeepLink().

  PUBLIC BUILD (v0.38): build-public.py writes public/index.html from this
  file with the PUBLIC flag set to true. That build is for readers outside
  Wake Forest: no sign-in, nothing recorded, no feedback form, no quiz card,
  a "public beta" line where the peer banner would be (naming Raina's email for
  feedback, at her request), and a practice note that says nothing is saved. Finished walkthroughs are remembered only in
  the reader's own browser (publicDone_, publicRemember_). Everything else is
  identical, by construction: it is the same file with one flag flipped.

  NAMING (v0.29): at Raina's decision, every lesson is now called a
  "walkthrough" instead of a "scrolly," site-wide (headings, buttons, aria
  text, deep-link help, and internal comments). The site's own title, "Prof.
  Haque's Administrative Law Scrollytelling," is unchanged, since it names
  the site's format, not the individual lessons. The builder function names
  (buildTrip1, buildGuide1, ...) also keep their historical names for the
  same reason given in the naming note near the top of this file; only what
  a reader or student sees changed.

  SCOPE OF REVIEW, SHARPENED (v0.31): on advice from an administrative law
  colleague, Walkthrough 6's beats 10 and 11 now separate two questions the
  earlier text ran together: whether the agency EXPLAINED how its evidence
  leads to its result (State Farm; failure is arbitrary and capricious even
  when the evidence was ample), and whether there was ENOUGH evidence, where
  the standard depends on procedure: substantial evidence for the FTC's formal
  adjudication (APA s 706(2)(E)), arbitrary and capricious for informal
  adjudication or rulemaking (s 706(2)(A)). Walkthrough 7's executive-order
  beat now uses the colleague's management-order framing (a manager's instruction
  binds those who work there and no one else), which fits the shaft exactly.
  Text only; no drawing changed.

  CONSTITUTIONALITY GAUGE (v0.30): Walkthrough 6, station 4 (due process) now
  shows a drawn instrument, cgauge(), instead of a plain page. It is the court's
  reading of a belt against the Constitution, the sibling of station 1's
  calipers, which read a belt against the statute. A court asks whether a belt
  VIOLATES the Constitution, never whether it complies, so the needle rests
  outside the red zone to mean only that this claim does not void the belt,
  not that the belt is wise. One scale is labeled per reading; the others stay
  on the dial, unlabeled, so students see this is one claim among several a
  court could apply. Imported from a sibling federalism project at Raina's
  decision; the gauge does not cover ultra vires or the major questions
  doctrine, since what a court holds there is that the agency exceeded the
  statute, not that something violates the Constitution, even though
  separation-of-powers concerns can shape how strictly the statute is read.

  WALKTHROUGH 2 CAMERA FIX (v0.28): v0.27's readability fix shrank every camera's
  width without checking whether its center was still correctly placed, which
  clipped the left margin of the statute page on several beats (worst on the
  beats that also had to hold a floating callout box in frame). See the two
  comments inside buildGuide1's camera setup, above the CALLOUT_BEATS object,
  for the full account and the per-beat fix.

  READABILITY AND WAYFINDING (v0.27): Walkthrough 2's camera is tightened (see the
  ZOOM_TIGHTEN comment inside buildGuide1) so its statute text renders larger,
  after two peer reviewers found it hard to read. Every lesson also now shows
  a persistent "Keep scrolling" cue beside the progress meter, added after
  reviewers said they had no sense of scroll progress; it is present in the
  markup lesson() builds and toggled in frame(), so every walkthrough gets it
  without each drawing function knowing about it.

  PRACTICE ANSWERS RECORDED (v0.34): at Raina's decision, every Check and
  every Show the answer is sent to the Answers tab as the answer in words
  (submitAnswer in Code.gs; see describe() in bindPractice). The practice
  section now says "Your answers are recorded, and Prof. Haque can see them";
  the earlier line saying what a student chose was not sent anywhere is gone.

  PRACTICE, FEEDBACK, AND PROGRESS (v0.26): practice questions are no longer
  described as optional; the practice section tells students plainly that
  they are ungraded, and that Prof. Haque can see whether they finished and
  how many they got right on the first try (submitProgress in Code.gs). The Feedback button is now available at all
  times, not only during peer testing; PeerTestMode now controls only the
  peer-test banner and a Mode column tag (Peer test or Student) on Feedback
  rows. The feedback prompt reads "Any feedback for this page design?"
  everywhere, at Raina's direction.

  HOME PAGE (v0.33, replacing the v0.25 design): the home page opens with the
  one Start button, above the fold, then the whole machine as a still picture
  (heroMachine(): a snapshot of the simulation's drawing, inert, gears still
  turning), then the path, then the card that opens the simulation page. From
  v0.25 to v0.32 the live simulation sat at the top, and its own panel said
  "Start here: click any part of the machine," so a new student's first
  instruction was the wrong one while the real Start button sat below the
  fold. The simulation page keeps Explore and Diagnose, with Diagnose gated by
  a one-time explainer card (see setMode()/renderDiagIntro()); its panel label
  now reads "Explore," so "Start here" means one thing on the whole site.

  READING MODE (v0.19): every lesson has a second view, reading(), that shows
  the same steps as an article with one still picture each and nothing moving.
  Any lesson opens in it when the browser asks for reduced motion. The stills
  come from the walkthrough's own drawing function, rendered into one hidden stage
  and snapshotted, so there is no second copy of the content.

  ACCESSIBILITY NOTES: the lesson stage and the reading stills are marked
  aria-hidden, because each step's words sit beside the picture and carry the
  content; a beat that has an "alt" field gets a described figure instead
  (writing those descriptions is an open item). The simulation's parts are
  focusable, have roles and labels, and answer to Enter and Space. There is a
  skip link to the content, and every form control is labelled.

  Code.gs and the SITE section are fully commented as of v0.16. The kit is
  commented from its original design handoff. The walkthrough builders and the
  simulation have section banners but are not yet commented line by line;
  that pass is an open item in the Series Plan and Scripts document.
=============================================================================
-->

/*

 * Created by Raina Haque. (c) 2026 Raina Haque.

 */

:root {
  /* colour, light theme */
  --gbb-paper:     #EFE9DD;  /* the ground of every frame */
  --gbb-panel:     #FFFDF8;  /* casing interior, statute page, tag */
  --gbb-ink:       #17140F;  /* every outline, every nameplate, all primary type */
  --gbb-ink-soft:  #665E4E;  /* notes and leader lines, never a part outline */
  --gbb-rule:      #CBC2AE;  /* ruled lines on a page, inactive field borders */
  --gbb-gear:      #E2DACA;  /* gear body */
  --gbb-enabling:  #14508C;  /* enabling statute belt */
  --gbb-approp:    #1E6B47;  /* appropriations belt */
  --gbb-agency:    #A9540F;  /* agency rule or order belt */
  --gbb-state:     #6B3A86;  /* state law belt */
  --gbb-signal:    #B3261E;  /* the one thing the narration points at, once per beat */

  /* stroke weight, poster: three or fewer machines on screen */
  --gbb-w-casing: 8px;
  --gbb-w-gear:   6px;
  --gbb-w-belt:   5px;
  --gbb-w-hair:   2.6px;
  --gbb-w-shaft:  22px;

  /* belt width is scope of power, in frame units */
  --gbb-belt-enabling: 30;
  --gbb-belt-approp:   22;
  --gbb-belt-agency:   34;
  --gbb-belt-order:    16;
  --gbb-belt-state:    24;

  /* type */
  --gbb-sans:  'Archivo', system-ui, sans-serif;
  --gbb-serif: 'Instrument Serif', Georgia, serif;

  /* spacing, base 8 */
  --gbb-s1: 4px;  --gbb-s2: 8px;  --gbb-s3: 12px; --gbb-s4: 16px; --gbb-s5: 24px;
  --gbb-s6: 32px; --gbb-s7: 48px; --gbb-s8: 64px; --gbb-s9: 96px;

  --gbb-radius: 0;        /* everything, with one exception */
  --gbb-radius-device: 4px;
}

/* Overview weight: four or more machines on screen, or the widest casing
   under 220 frame units. Add data-weight="overview" to the frame element. */
[data-weight="overview"] {
  --gbb-w-casing: 4px;
  --gbb-w-gear:   3px;
  --gbb-w-belt:   3px;
  --gbb-w-hair:   1.6px;
  --gbb-w-shaft:  14px;
}

/* Dark is a straight swap of the eleven colour tokens.
   No shape, weight or size changes with the theme. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --gbb-paper:    #14120E;
    --gbb-panel:    #1E1B15;
    --gbb-ink:      #F1EBDF;
    --gbb-ink-soft: #A69C88;
    --gbb-rule:     #403A2E;
    --gbb-gear:     #2C2820;
    --gbb-enabling: #4E92D6;
    --gbb-approp:   #4FA678;
    --gbb-agency:   #D18A3A;
    --gbb-state:    #A277C4;
    --gbb-signal:   #E2705F;
  }
}

:root[data-theme="dark"] {
  --gbb-paper:    #14120E;
  --gbb-panel:    #1E1B15;
  --gbb-ink:      #F1EBDF;
  --gbb-ink-soft: #A69C88;
  --gbb-rule:     #403A2E;
  --gbb-gear:     #2C2820;
  --gbb-enabling: #4E92D6;
  --gbb-approp:   #4FA678;
  --gbb-agency:   #D18A3A;
  --gbb-state:    #A277C4;
  --gbb-signal:   #E2705F;
}

/* motion */
@keyframes gbb-spin     { to { transform: rotate(360deg) } }
@keyframes gbb-spin-ccw { to { transform: rotate(-360deg) } }
@keyframes gbb-run      { to { stroke-dashoffset: -48 } }
@keyframes gbb-wobble   { 0%, 100% { transform: rotate(-2.2deg) } 50% { transform: rotate(2.2deg) } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}

<template id="simtpl"><div class="simroot">
<div class="simhead">
  <h1>The simulation</h1>
  <p>Government is one very complex machine made of many smaller machines. Each government body is a housing with a black nameplate. Labels without a nameplate are gears, belts, or other parts. Gears are working groups of people inside them. Belts carry power across boundaries. A block stops something before it takes effect, like a veto. A cut removes a belt that already exists, which is what courts do. The gear that made the belt keeps turning. Click any part of the machine to see what it is, then switch to Diagnose to find where a machine broke.</p>
</div>

<div class="simmain">
  <section class="fig" aria-label="The machine">
    <svg id="m" viewBox="0 0 920 580" role="group" aria-label="Diagram of the federal and state regulatory machine"></svg>
    <div class="legend ui">
      <span><i style="border-color:var(--ink);border-top-width:11px"></i>Government body (housing with a nameplate)</span>
      <span><i style="border-color:var(--enabling)"></i>Enabling statute belt</span>
      <span><i style="border-color:var(--funding)"></i>Appropriations belt</span>
      <span><i style="border-color:var(--rule)"></i>Agency's belts (wide: rule, narrow: order)</span>
      <span><i style="border-color:var(--state)"></i>State law belt</span>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs ui" role="tablist">
      <button role="tab" id="tExplore" aria-selected="true">Explore</button>
      <button role="tab" id="tDiag" aria-selected="false">Diagnose</button>
    </div>

<div class="simfoot">
  <details>
    <summary>Prototype notes for the build team</summary>
    <ul>
      <li>Components: 11 gears (Congress, House, Senate, President, the agency's head, rulemaking, and adjudication gears, courts, regulated company, state legislature, state attorney general), 5 belts (enabling statute, appropriations, rule, order, state law), the APA quality check, a belt gauge, the agency's mounting shaft, and a court block.</li>
      <li>Explore mode teaches vocabulary, lists the reasons each belt can be cut, tagged by unit so that the federalism entries now shown under Later in the course can be given full treatment when that unit is built, and lets students try four cuts. When Congress cuts the enabling statute or appropriations belt, the agency stops. When a court cuts the rule belt or the order belt, only that belt goes and the agency keeps turning. Diagnose mode presents a fact pattern and asks where the machine broke. Students answer in two steps: where the machine broke, then what doctrine a party would invoke to convince an Article III court to throw the block. A correct answer sends a cut from the courts to the unlawful belt, which separates while the agency's gears keep turning. It names and defines the legal terms in bold italics, and shows the supporting authority as a citation with a parenthetical. Some scenarios hide a choice that would be arguably correct.</li>
      <li>A production version would add: short video segments before each part, per-student logging of first-try accuracy, score passback to Canvas, course-specific scenario sets, and a parallel scenario bank for make-ups.</li>
      <li>Legal content here is draft. Every citation and parenthetical was written from memory and must be checked against the reporters before student use.</li>
    </ul>
  </details>
</div>

<script>
/* ===================== CIVIC POSTER KIT ===================== */
/*
 * Gears, Belts and Blocks - Civic Poster parts kit
 * Created by Raina Haque. (c) 2026 Raina Haque.
 * May be used only with the express permission of Raina Haque.
 *
 * Every part returns an SVG source string. Nothing here touches the DOM, so
 * the same functions serve a browser animation, a static export, or a build
 * step that writes .svg files.
 *
 *   import { createKit } from './gbb-parts.js';
 *   const kit = createKit({ theme: 'light', weight: 'poster' });
 *   svg.innerHTML = kit.defs() + kit.casing({ x: 250, y: 140, w: 440, h: 440, name: 'FTC' });
 *
 * All coordinates are frame units in a 1280 x 720 design space.
 */

const TOKENS = {
  light: {
    paper: '#EFE9DD', panel: '#FFFDF8', ink: '#17140F', inkSoft: '#665E4E',
    rule: '#CBC2AE', gear: '#E2DACA', signal: '#B3261E',
    belt: { enabling: '#14508C', approp: '#1E6B47', agency: '#A9540F', state: '#6B3A86' },
  },
  dark: {
    paper: '#14120E', panel: '#1E1B15', ink: '#F1EBDF', inkSoft: '#A69C88',
    rule: '#403A2E', gear: '#2C2820', signal: '#E2705F',
    belt: { enabling: '#4E92D6', approp: '#4FA678', agency: '#D18A3A', state: '#A277C4' },
  },
};

const WEIGHTS = {
  poster:   { casing: 8, gear: 6, belt: 5, hair: 2.6, shaft: 22, typeStep: 0 },
  overview: { casing: 4, gear: 3, belt: 3, hair: 1.6, shaft: 14, typeStep: 1 },
};

/* Belt width is meaning, not decoration: it is the scope of the power. */
const BELT_WIDTH = { enabling: 30, approp: 22, agency: 34, order: 16, state: 24 };

const FONTS = {
  sans: "'Archivo', system-ui, sans-serif",
  serif: "'Source Serif 4', Georgia, serif",
  googleHref: 'https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,700&display=swap',
};

/* Type scale, in frame units. Overview weight steps each one up by 2. */
const TYPE = {
  nameplate: 34, machine: 22, part: 19, caption: 28, term: 34, note: 15, stamp: 13, legend: 16,
};

const MOTION = {
  gearPeriod: (r) => r / 11,              // seconds per turn, so all gears share a surface speed
  beltCycle: 1.6,                          // seconds per dash cycle
  camera: { min: 1.8, max: 4.0, easing: 'cubic-bezier(.22,.9,.24,1)' },
  termReveal: { fade: 0.5, rise: 16, barWipe: 0.4 },
  blockDrop: 0.25,
  stopWithin: 0.4,
};

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const n = (v) => Math.round(v * 10) / 10;

/* ------------------------------------------------------------------ kit -- */
function createKit({ theme = 'light', weight = 'poster', idPrefix = 'gbb' } = {}) {
  const t = TOKENS[theme];
  const w = WEIGHTS[weight];
  const p = (name) => `${idPrefix}-${name}`;
  const step = w.typeStep * 2;

  const text = (x, y, s, size, fill, family, anchor = 'middle', weightv = '700', italic = false, ls = 0) =>
    `<text x="${n(x)}" y="${n(y)}" font-family="${family}" font-size="${size}" fill="${fill}" ` +
    `text-anchor="${anchor}" font-weight="${weightv}"${italic ? ' font-style="italic"' : ''}` +
    `${ls ? ` letter-spacing="${ls}"` : ''}>${esc(s)}</text>`;

  /* Belt fill patterns are the second cue beside colour, for colour-blind viewers. */
  const defs = () => `<defs>
<pattern id="${p('diag')}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V10" stroke="${t.ink}" stroke-width="3.2" opacity="0.30"/></pattern>
<pattern id="${p('dot')}" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.4" fill="${t.ink}" opacity="0.32"/></pattern>
<pattern id="${p('line')}" width="10" height="9" patternUnits="userSpaceOnUse"><path d="M0 4.5 H10" stroke="${t.ink}" stroke-width="2.6" opacity="0.30"/></pattern>
<pattern id="${p('cross')}" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M0 0 L11 11 M11 0 L0 11" stroke="${t.ink}" stroke-width="2.4" opacity="0.28"/></pattern>
</defs>`;

  const PATTERN = { enabling: 'diag', approp: 'dot', agency: 'line', order: 'line', state: 'cross' };

  /* --------------------------------------------------------------- gear -- */
  function gearPath(cx, cy, r, teeth) {
    const count = teeth || Math.max(9, Math.round(r / 9.5));
    const depth = 0.22, t0 = 0.14, t1 = 0.36, t2 = 0.50;
    const ri = r * (1 - depth);
    let d = '';
    for (let i = 0; i < count; i++) {
      const a0 = (2 * Math.PI * i) / count;
      const pitch = (2 * Math.PI) / count;
      [[ri, a0], [r, a0 + pitch * t0], [r, a0 + pitch * t1], [ri, a0 + pitch * t2]].forEach(([rr, aa], j) => {
        d += (i === 0 && j === 0 ? 'M' : 'L') + n(cx + rr * Math.cos(aa)) + ' ' + n(cy + rr * Math.sin(aa));
      });
    }
    return d + 'Z';
  }

  /* A gear is one working group of people. A company is a gear like any other. */
  function gear({ cx, cy, r, spin = false, ccw = false, wobble = false, teeth, id }) {
    let anim = '';
    if (wobble) anim = 'animation: gbb-wobble 1.7s ease-in-out infinite;';
    else if (spin) anim = `animation: gbb-spin${ccw ? '-ccw' : ''} ${n(MOTION.gearPeriod(r))}s linear infinite;`;
    const style = `transform-origin: ${n(cx)}px ${n(cy)}px; transform-box: view-box; ${anim}`;
    return `<g${id ? ` id="${id}"` : ''} style="${style}">` +
      `<path d="${gearPath(cx, cy, r, teeth)}" fill="${t.gear}" stroke="${t.ink}" stroke-width="${w.gear}" stroke-linejoin="round" stroke-linecap="round"/>` +
      `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r * 0.30)}" fill="${t.paper}" stroke="${t.ink}" stroke-width="${w.gear}"/>` +
      `<circle cx="${n(cx + r * 0.60)}" cy="${n(cy)}" r="${n(Math.max(4, r * 0.085))}" fill="${t.ink}"/>` +
      `</g>`;
  }

  /* Where a second gear must sit for its teeth to actually engage. */
  const meshCenter = (cx, cy, R, r, angleDeg) => {
    const d = (R + r) * 0.90;
    return [cx + d * Math.cos((angleDeg * Math.PI) / 180), cy + d * Math.sin((angleDeg * Math.PI) / 180)];
  };

  /* Mesh is teeth touching. Never draw a connector between meshing gears. */
  const meshMark = (x, y, angle = 0) =>
    `<g transform="translate(${n(x)},${n(y)}) rotate(${n(angle)})"><path d="M0 -20 Q13 0 0 20 Q-13 0 0 -20 Z" fill="${t.ink}"/></g>`;

  /* Brake: what holds a stopped gear still, so the stop has a visible cause. */
  const brake = (cx, cy, r, angle = 0) =>
    `<g transform="translate(${n(cx)},${n(cy)}) rotate(${n(angle)})">` +
    `<rect x="${n(r + 3)}" y="-19" width="32" height="38" fill="${t.ink}"/>` +
    `<path d="M${n(r + 1.5)} -19 V19" stroke="${t.ink}" stroke-width="${w.hair * 4}"/>` +
    `<path d="M${n(r + 10)} -11 h18 M${n(r + 10)} 0 h18 M${n(r + 10)} 11 h18" stroke="${t.paper}" stroke-width="${n(w.hair * 0.8)}" opacity="0.85"/></g>`;

  /* ------------------------------------------------------------- casing -- */
  const PLATE = 58;
  const innerTop = () => 0;
  const innerHeight = (h, named = true) => (named ? h - PLATE : h);

  /* One government body. Nothing inside is visible until the trip needs it. */
  function casing({ x, y, w: cw, h: ch, name = null, sub = null, size = TYPE.nameplate }) {
    let s = `<g><rect x="${n(x)}" y="${n(y)}" width="${n(cw)}" height="${n(ch)}" fill="${t.panel}" stroke="${t.ink}" stroke-width="${w.casing}"/>`;
    if (name) {
      s += `<rect x="${n(x)}" y="${n(y + ch - PLATE)}" width="${n(cw)}" height="${PLATE}" fill="${t.ink}"/>`;
      s += text(x + cw / 2, y + ch - PLATE + 40, name, size + step, t.paper, FONTS.sans, 'middle', '700', false, 1);
    }
    if (sub) s += text(x + cw / 2, y + ch + 26, sub, TYPE.note + 3 + step, t.inkSoft, FONTS.sans, 'middle', '500');
    return s + '</g>';
  }

  /* Only an agency opens, and it opens to exactly three gears. */
  function faceplate({ x, y, w: fw, h: fh, dx, dy = 10 }) {
    return `<g>` +
      `<path d="M${n(x + fw)} ${n(y)} L${n(x + dx)} ${n(y + dy)} M${n(x + fw)} ${n(y + fh)} L${n(x + dx)} ${n(y + dy + fh)}" stroke="${t.inkSoft}" stroke-width="1.4" stroke-dasharray="7 6"/>` +
      `<rect x="${n(x + dx)}" y="${n(y + dy)}" width="${n(fw)}" height="${n(fh)}" fill="${t.gear}" stroke="${t.ink}" stroke-width="5"/></g>`;
  }

  /* Supervision inside one branch. Short, straight, and it never crosses a boundary. */
  function shaft({ x1, y1, x2, y2, thick = w.shaft }) {
    const L = Math.hypot(x2 - x1, y2 - y1);
    const a = (Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI;
    return `<g transform="translate(${n(x1)},${n(y1)}) rotate(${n(a)})">` +
      `<rect x="0" y="${n(-thick / 2)}" width="${n(L)}" height="${n(thick)}" fill="${t.ink}"/>` +
      `<rect x="0" y="${n(-thick * 0.98)}" width="26" height="${n(thick * 1.96)}" fill="${t.ink}"/>` +
      `<rect x="${n(L - 26)}" y="${n(-thick * 0.98)}" width="26" height="${n(thick * 1.96)}" fill="${t.ink}"/></g>`;
  }

  /* --------------------------------------------------------------- belt -- */
  /* A belt is always a written legal document, and it always crosses a boundary. */
  function belt({ x1, y1, x2, y2, kind, width, title = null, travel = false }) {
    const key = kind === 'order' ? 'agency' : kind;
    const c = t.belt[key];
    const bw = width || BELT_WIDTH[kind];
    const L = Math.hypot(x2 - x1, y2 - y1);
    const a = (Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI;
    const h = bw / 2;
    let s = `<g transform="translate(${n(x1)},${n(y1)}) rotate(${n(a)})">`;
    s += `<rect x="0" y="${n(-h)}" width="${n(L)}" height="${n(bw)}" fill="${c}"/>`;
    s += `<rect x="0" y="${n(-h)}" width="${n(L)}" height="${n(bw)}" fill="url(#${p(PATTERN[kind])})"/>`;
    s += `<rect x="0" y="${n(-h)}" width="${n(L)}" height="${n(bw)}" fill="none" stroke="${t.ink}" stroke-width="${bw > 20 ? w.belt : w.belt * 0.8}"/>`;
    for (let x = 108; x < L - 24; x += 108) {
      s += `<path d="M${n(x)} ${n(-h + 2)} V${n(h - 2)}" stroke="${t.ink}" stroke-width="3" opacity="0.45"/>`;
    }
    if (title && bw >= 20 && L > 190) {
      const tw = title.length * 8.2 + 22;
      const bx = Math.max(22, L * 0.22);
      s += `<rect x="${n(bx)}" y="${n(-h + 4)}" width="${n(tw)}" height="${n(bw - 8)}" fill="${t.panel}" stroke="${t.ink}" stroke-width="3"/>`;
      s += text(bx + tw / 2, 4.6, title, TYPE.stamp, t.ink, FONTS.sans, 'middle', '700', false, 1);
    }
    if (travel) {
      s += `<path d="M0 0 H${n(L)}" stroke="${t.panel}" stroke-width="${n(Math.max(2, bw * 0.10))}" ` +
        `stroke-dasharray="4 34" stroke-linecap="round" fill="none" opacity="0.5" ` +
        `style="animation: gbb-run ${MOTION.beltCycle}s linear infinite;"/>`;
    }
    return s + '</g>';
  }

  /* The wrap that shows a belt is driven by the gear, not floating past it. */
  function beltWrap({ cx, cy, r, kind, a0, a1 }) {
    const key = kind === 'order' ? 'agency' : kind;
    const c = t.belt[key];
    const rad = (d) => (d * Math.PI) / 180;
    return `<path d="M${n(cx + r * Math.cos(rad(a0)))} ${n(cy + r * Math.sin(rad(a0)))} ` +
      `A${n(r)} ${n(r)} 0 0 1 ${n(cx + r * Math.cos(rad(a1)))} ${n(cy + r * Math.sin(rad(a1)))}" ` +
      `fill="none" stroke="${c}" stroke-width="${n(Math.max(5, BELT_WIDTH[kind] * 0.3))}" opacity="0.9"/>`;
  }

  /* The standard Congress wrote in. It hangs from the belt, never from a machine. */
  function beltTag({ x, yBelt, w: tw, h: th, head, lines, drop = 58, kind = 'enabling' }) {
    const top = yBelt + drop;
    let s = `<g><path d="M${n(x)} ${n(yBelt)} V${n(top)}" stroke="${t.ink}" stroke-width="4"/>`;
    s += `<rect x="${n(x - tw / 2)}" y="${n(top)}" width="${n(tw)}" height="${n(th)}" fill="${t.panel}" stroke="${t.ink}" stroke-width="5"/>`;
    s += `<rect x="${n(x - tw / 2)}" y="${n(top)}" width="${n(tw)}" height="9" fill="${t.belt[kind]}"/>`;
    if (head) s += text(x, top + 30, head, TYPE.part + step, t.inkSoft, FONTS.sans, 'middle', '500');
    lines.forEach((l, i) => { s += text(x, top + 70 + i * 34, l, 24 + step, t.ink, FONTS.sans, 'middle', '700'); });
    return s + '</g>';
  }

  /* Set the seal exactly where a belt crosses a boundary, and nowhere else. */
  function docSeal({ x, y, scale = 1, color }) {
    const c = color || t.ink;
    const fold = 11;
    return `<g transform="translate(${n(x)},${n(y)}) scale(${scale})">` +
      `<path d="M-17 -23 H${17 - fold} L17 ${-23 + fold} V23 H-17 Z" fill="${t.panel}" stroke="${c}" stroke-width="4"/>` +
      `<path d="M${17 - fold} -23 H${17 - fold} V${-23 + fold}" fill="none" stroke="${c}" stroke-width="3.2"/>` +
      `<path d="M-10 -8 H10 M-10 0 H10 M-10 8 H8" stroke="${c}" stroke-width="3" opacity="0.75"/></g>`;
  }

  /* A court setting something aside. What it lands on must visibly stop. */
  const block = ({ x, y, angle = 0, scale = 1 }) =>
    `<g transform="translate(${n(x)},${n(y)}) rotate(${n(angle)}) scale(${scale})">` +
    `<path d="M-34 -30 L34 -12 L34 12 L-34 30 Z" fill="${t.ink}" stroke="${t.ink}" stroke-width="5" stroke-linejoin="round"/>` +
    `<path d="M-18 -20 L-18 20 M0 -15 L0 15 M18 -10 L18 10" stroke="${t.paper}" stroke-width="3.4"/></g>`;

  /* Measuring one belt against the grant above it. Show both belts or it means nothing. */
  function gauge({ cx, cy, half, angle = 0 }) {
    const lw = 5;
    let s = `<g transform="translate(${n(cx)},${n(cy)}) rotate(${n(angle)})">`;
    [-1, 1].forEach((sg) => { s += `<path d="M-19 ${n(sg * half)} h38" stroke="${t.ink}" stroke-width="${lw}" stroke-linecap="round"/>`; });
    s += `<path d="M0 ${n(-half)} V${n(half)}" stroke="${t.ink}" stroke-width="${n(lw * 0.7)}"/>`;
    s += `<path d="M0 ${n(-half)} l-5 9 M0 ${n(-half)} l5 9" stroke="${t.ink}" stroke-width="${n(lw * 0.7)}" fill="none"/>`;
    s += `<path d="M0 ${n(half)} l-5 -9 M0 ${n(half)} l5 -9" stroke="${t.ink}" stroke-width="${n(lw * 0.7)}" fill="none"/>`;
    for (let i = 0; i <= Math.floor((half * 2) / 8); i++) {
      s += `<path d="M19 ${n(-half + i * 8)} h${i % 3 === 0 ? 11 : 6}" stroke="${t.ink}" stroke-width="1.5" opacity="0.7"/>`;
    }
    return s + '</g>';
  }

  /* The Administrative Procedure Act, on the agency's own outgoing belts only. */
  function qualityCheck({ cx, cy, w: qw = 126, h: qh = 48, label = 'APA check' }) {
    return `<g><rect x="${n(cx - qw / 2)}" y="${n(cy - qh / 2)}" width="${n(qw)}" height="${n(qh)}" fill="${t.panel}" stroke="${t.ink}" stroke-width="5"/>` +
      `<path d="M${n(cx - qw / 2)} ${n(cy + qh / 2)} v14 M${n(cx + qw / 2)} ${n(cy + qh / 2)} v14" stroke="${t.ink}" stroke-width="4"/>` +
      text(cx, cy + 5, label, TYPE.part + step, t.ink, FONTS.sans, 'middle', '700') + '</g>';
  }

  /* A belt may cross this line. A shaft may not. */
  const boundary = ({ x, y0, y1 }) =>
    `<path d="M${n(x)} ${n(y0)} V${n(y1)}" stroke="${t.ink}" stroke-width="4" stroke-dasharray="16 12"/>`;

  const zone = ({ x0, x1, y0, y1, name }) =>
    `<g><rect x="${n(x0)}" y="${n(y0)}" width="${n(x1 - x0)}" height="${n(y1 - y0)}" fill="${t.gear}" opacity="0.5"/>` +
    `<rect x="${n(x0)}" y="${n(y0)}" width="${n(x1 - x0)}" height="38" fill="${t.ink}"/>` +
    text((x0 + x1) / 2, y0 + 26, name, 19 + step, t.paper, FONTS.sans, 'middle', '700', false, 1.6) + '</g>';

  /* Who holds the office. Silhouettes only, no faces, never more than the real number. */
  function figures({ cx, y, count = 5, gap = 46, k = 1 }) {
    let s = '<g>';
    const start = cx - ((count - 1) * gap) / 2;
    for (let i = 0; i < count; i++) {
      const x = start + i * gap;
      s += `<circle cx="${n(x)}" cy="${n(y - 20 * k)}" r="${n(8.5 * k)}" fill="${t.ink}"/>`;
      s += `<path d="M${n(x - 11 * k)} ${n(y)} v${n(-9 * k)} a${n(11 * k)} ${n(11 * k)} 0 0 1 ${n(22 * k)} 0 v${n(9 * k)} z" fill="${t.ink}"/>`;
    }
    return s + '</g>';
  }

  /* A term the narration defines out loud. One on screen at a time. */
  function termLabel({ x, y, s: str, size = TYPE.term, id }) {
    const bw = str.length * (size * 0.48);
    return `<g${id ? ` id="${id}"` : ''}>` +
      text(x, y, str, size, t.ink, FONTS.serif, 'start', '700', true) +
      `<rect x="${n(x)}" y="${n(y + 10)}" width="${n(bw)}" height="6" fill="${t.ink}" ` +
      `style="transform-box: fill-box; transform-origin: left center;"/></g>`;
  }

  /* The one sentence of the beat. Bottom of frame, never more than two lines. */
  const caption = ({ cx, y, s: str, width = 1160 }) =>
    `<g><path d="M${n(cx - width / 2)} ${n(y - 38)} H${n(cx + width / 2)}" stroke="${t.ink}" stroke-width="5"/>` +
    text(cx, y, str, TYPE.caption + step, t.ink, FONTS.sans, 'middle', '700') + '</g>';

  /* Closes every trip. The notice is set in full, never abbreviated. */
  const endCard = ({ x, y, w: ew, h: eh }) =>
    `<g><rect x="${n(x)}" y="${n(y)}" width="${n(ew)}" height="${n(eh)}" fill="${t.panel}" stroke="${t.ink}" stroke-width="7"/>` +
    gear({ cx: x + 110, cy: y + eh / 2, r: 44 }) +
    text(x + 200, y + 74, 'Created by Raina Haque. (c) 2026 Raina Haque.', 25, t.ink, FONTS.serif, 'start', '600') +
    text(x + 200, y + 112, 'May be used only with the express permission of Raina Haque.', 25, t.ink, FONTS.serif, 'start', '400') + '</g>';

  return {
    theme, weight, tokens: t, weights: w, defs, text,
    gearPath, gear, meshCenter, meshMark, brake,
    casing, faceplate, innerTop, innerHeight, shaft,
    belt, beltWrap, beltTag, docSeal, block, gauge, qualityCheck,
    boundary, zone, figures, termLabel, caption, endCard,
  };
}

/* The keyframes every animated part expects. Inject once per document. */
const KEYFRAMES = `
@keyframes gbb-spin{to{transform:rotate(360deg)}}
@keyframes gbb-spin-ccw{to{transform:rotate(-360deg)}}
@keyframes gbb-run{to{stroke-dashoffset:-48}}
@keyframes gbb-wobble{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
`;

var TRIPS = [{"n":1,"title":"Why does the website ask if you are 13?","minutes":6,"build":"buildTrip1","intro":"Scroll down at your own pace. As you scroll, you travel backward along the path that put that question on your screen, from your phone to its origin. The text for each step appears beside the picture.","version":"Scroll lesson v0.11, built from script v0.16.","cardTerms":{"6":["A rule>A |rule","regulation"],"7":["administrative agency"],"9":["statute"],"10":["enabling statute","delegation"],"12":["nondelegation doctrine","intelligible principle"]},"terms":["statute","administrative agency","rule or regulation","enabling statute","delegation","nondelegation doctrine","intelligible principle"],"beats":[{"n":1,"cam":[3000,400,1000],"text":"Think back to the first time a website or app asked you: are you 13 or older? Almost everyone has seen that question. Few people ask where it came from.","alt":"A phone showing a sign-up screen with a birthday field and the question: are you 13 or older?"},{"n":2,"cam":[2720,400,1350],"text":"Why 13? And why does the site care at all? The easy guess is that the website came up with this on its own. It did not.","alt":"The number 13 enlarges on screen. The caption reads: the website's own idea?, over the company's building."},{"n":3,"cam":[3000,400,1000],"text":"Suppose you answered no because you are 12 years old. Some sites turn you away. Others stop and ask for a parent's permission, and a checkbox is not enough. The parent might have to sign a form, use a payment card, or take a phone call. Who came up with that list?","alt":"The phone changes to an ask a parent screen listing three methods: signed form, payment card, phone call."},{"n":4,"cam":[2650,400,1600],"text":"To find out, we will follow both questions backward, one step at a time, from your screen to their source.","alt":"The camera pulls back from the phone to the company behind it."},{"n":5,"cam":[2380,420,950],"text":"Start with the company. A company is a group of people, and in this series any group of people is drawn as a gear or gears. The company did make a choice here. It chose how to comply with a legal requirement. It could build a parent permission process, or it could turn away children under 13 and avoid the problem. But it did not write the requirement. The company's hired lawyers or compliance professionals probably helped it make the decision to comply with the federal rule.","alt":"The building becomes a gear labeled Company. A belt, still dim, is attached to the gear."},{"n":6,"cam":[2170,296,1020],"text":"That rule is called the COPPA Rule. A rule, also called a regulation, is a binding requirement written by a government agency. Among other things, this one lists the approved ways to confirm a parent's consent, which the statute calls \"verifiable parental consent.\" A rule is not a group of people. It is a document that carries power from one place to another. We draw that as a belt.","alt":"The amber belt lights up, stamped COPPA Rule. A page titled COPPA Rule shows the list of approved consent methods. The terms rule and regulation appear."},{"n":7,"cam":[1500,455,1000],"text":"Follow the belt and you reach what made it: the Federal Trade Commission, or FTC. Government is one very complex machine made of many smaller machines, and the FTC is one of them. It is an administrative agency, a body in the executive branch that carries out the law in a particular area. It is led by five commissioners. For now its casing stays closed. We will open it in Walkthrough 3.","alt":"The camera travels along the belt to a closed machine casing labeled FTC, with a gear inside and five small figures on top. The term administrative agency appears."},{"n":8,"cam":[1380,420,1200],"text":"So the FTC wrote the list. But that only moves the question. Nobody elected the FTC. Where does an agency get the legitimate power to write rules, in this case rules about verifiable parental consent, that bind a company?","alt":"The gear inside the FTC turns. The caption reads: who turns this machine? The camera finds a second belt arriving from off screen."},{"n":9,"cam":[1010,310,1000],"text":"From a second belt. The FTC already existed: Congress created it in 1914 with a different statute, the agency's organic statute. In 1998 Congress added a second belt, a statute called the Children's Online Privacy Protection Act, or COPPA. A statute is a law passed by Congress. This one makes the basic choices. It defines a child as a person under 13. It requires verifiable parental consent before a site collects a child's personal information. And it assigns the FTC to write rules that fill in the details, such as what counts as verifiable. Two names that look alike: from here on, the COPPA statute means this law Congress passed, and the COPPA Rule means the regulation the FTC wrote under it.","alt":"The camera follows a blue belt stamped COPPA (1998). A page of statute text appears with two phrases highlighted: under the age of 13, and verifiable parental consent. The term statute appears."},{"n":10,"cam":[1010,335,1000],"text":"A statute that gives an agency its power is called an enabling statute. The handoff of power is called delegation. Congress sets the policy and delegates the details. So our two questions have two answers. Congress chose age 13 as the cutoff point for needing verifiable parental consent. The agency got to write the list of what constitutes verifiable parental consent.","alt":"The terms enabling statute and delegation appear along the blue belt. The caption reads: Congress set the cutoff at 13, the agency defined verifiable consent."},{"n":11,"cam":[500,440,1150],"text":"Follow this belt back to where it begins and you reach Congress, the machine created by Article I of the Constitution. Inside it are two gears, the House and the Senate. This is the origin of the path we have been tracing. The number 13 started here. The list started at the FTC, because Congress told the FTC to write it.","cam2":{"at":0.45,"cam":[1700,430,3300]},"alt":"A machine casing labeled Congress, with a large gear and the House and Senate gears inside. The number 13 travels from Congress to the phone, and a small list travels from the FTC to the phone."},{"n":12,"cam":[1250,650,1100],"text":"Can Congress hand off as much power as it likes? No. Under the nondelegation doctrine, Congress must give the agency a guiding standard, which courts call an intelligible principle. Congress could not tell an agency to make whatever rules it thinks best. The COPPA statute meets this test, because it lists what the FTC's rules must require.","alt":"A tag on the blue belt lists notice, parental consent, access, security. Beside it, a belt with a blank tag turns gray and goes slack."},{"n":13,"cam":[1700,430,3300],"text":"Look at the pattern. Congress and the FTC are machines in different branches of government, and the company is outside government altogether. Power crossed each of those boundaries on a belt, and every belt is a written document. Call that the belt rule. It is this series' name, not a lawyer's, but the idea behind it is the law: when power crosses a boundary, there is a document, and its words set the limits of that belt.","alt":"Dashed boundaries appear for the legislative branch, the executive branch, and the public. The two belts cross them, with a document seal on each belt where it crosses a boundary."},{"n":14,"cam":[1700,430,3300],"text":"Here is the full path. Congress passed an enabling statute. The statute delegated power to an agency. The agency wrote a rule. The rule reached the company. The company chose how to comply, and put a question on your screen.","alt":"The chain animates left to right: Congress, the blue belt, the FTC, the amber belt, the company, and the phone, each part starting to move as power reaches it."},{"n":15,"cam":[1700,430,3300],"text":"So the website did not come up with this on its own. It chose how to comply with a requirement it did not write. Congress set the age and required a parent's consent. An agency, using power Congress gave it, wrote how that consent must be obtained. Next: how did the agency write that rule, and who checks its work?","alt":"The caption, the website's own idea?, is struck through. The list of terms from this walkthrough appears: statute, administrative agency, enabling statute, delegation, nondelegation doctrine, intelligible principle, rule or regulation."}],"practice":[{"type":"cat","prompt":"Sort each item.","cats":["A group of people (a gear, or a machine with gears inside)","A written legal document (a belt)"],"items":[["Congress",0],["The FTC",0],["The company",0],["The COPPA statute",1],["The COPPA Rule",1]],"fb":"Anything with people in it is a gear or a machine. Anything that carries power from one place to another is a belt, and a belt is always a written document."},{"type":"order","prompt":"Put the path in order, starting where the power begins and ending at your screen.","items":["Congress passes an enabling statute","The statute delegates power to an agency","The agency writes a rule","The rule reaches the company","The company puts a question on your screen"],"fb":"In the walkthrough you traveled this path backward. Power moves in this direction, and Congress is the origin."},{"type":"num","prompt":"Under the COPPA statute, a \"child\" is a person under what age?","answer":13,"fb":"Congress chose this number and wrote it into the statute, not into the FTC's rule."},{"type":"mc","prompt":"Who wrote the list of approved ways to get a parent's consent, and where is it written?","options":["The FTC, in the COPPA Rule","Congress, in the statute","The website, in its terms of service","The President, in an executive order"],"answer":0,"fb":"Congress required parental consent and told the FTC to fill in the details. The FTC wrote the list in a rule."},{"type":"blank","prompt":"A statute that gives an agency its power is called an {0} statute. The handoff of power is called {1}. Under the {2} doctrine, Congress must give the agency a guiding standard, which courts call an {3} principle.","bank":["arbitrary","delegation","enabling","executive","intelligible","nondelegation","preemption"],"answers":["enabling","delegation","nondelegation","intelligible"],"fb":"These four terms describe how an agency gets its power and the limit on how Congress may give it."},{"type":"multi","prompt":"Which of these did the company itself decide? Select all that apply.","options":[["Whether to build a parent permission process or turn away children under 13",true],["What its sign-up screen looks like",true],["The age cutoff",false],["Which consent methods count as verifiable",false]],"fb":"The company chose how to comply. It did not write the requirement."}]},{"n":2,"title":"What does the statute actually say?","minutes":7,"build":"buildGuide1","intro":"Scroll down at your own pace. This walkthrough takes the COPPA statute apart. The statute's own text stays in front of you, and as you scroll, each part lights up with its name and its job. This is the skill the quiz in class asks you to use.","version":"Scroll lesson v0.6, built from script v0.5.","cardTerms":{"2":["organic statute"],"3":["enabling statute"],"7":["substantive command"],"8":["operative text"],"9":["contested term"]},"terms":["organic statute","enabling statute","substantive command","operative text","contested term","delegation (review)"],"beats":[{"n":1,"cam":[0,0,0],"text":"Every walkthrough in this series passes along a belt from Congress: a statute. It is easy to think a statute is an incomprehensible jumble of legalese. It is not. A statute has parts, and each part has a job. We will take apart the COPPA statute from Walkthrough 1, piece by piece. The same parts show up in almost every statute that gives an agency power.","alt":"The full text of the COPPA statute, sections 6501 to 6506, on a page, under the caption: a jumble of legalese?"},{"n":2,"cam":[0,0,0],"text":"Start with a puzzle from Walkthrough 1, where the COPPA statute was called a second belt. Both belts come from Congress. The first, in 1914, was the Federal Trade Commission Act. It built the FTC, so it is the agency's organic statute. In 1998 Congress sent a second belt to the same agency: the COPPA statute, which handed it new work.","alt":"Congress, on the left, runs two belts to the FTC. The first is stamped FTC Act 1914 and labeled: builds the FTC. The second, stamped COPPA 1998, arrives later and is labeled: a new job for the same agency. The term organic statute appears above the first."},{"n":3,"cam":[0,0,0],"text":"So which statute enabled the COPPA Rule? The COPPA statute did. That makes it the enabling statute for this rule. An agency has one organic statute, and it can have many enabling statutes. For any agency action, ask: which statute enabled this?","alt":"The COPPA Rule belt leaves the FTC. The term enabling statute appears below the COPPA belt."},{"n":4,"cam":[0,0,0],"text":"Now open the COPPA statute. Lawyers read a statute in a set order. Three pieces do most of the work: the definitions, the command, and the grant of power to the agency. Read those first.","alt":"The page of the COPPA statute, with three pieces numbered one, two, and three: definitions, command, and grant of power."},{"n":5,"cam":[0,0,0],"text":"First, the definitions. Most statutes define their key words near the top, and those definitions control. Here Congress defined a child as \"an individual under the age of 13.\" That one line is where the number 13 on your screen comes from.","alt":"Section 6501(1) is highlighted on the page, tagged Part 2, Definitions."},{"n":6,"cam":[0,0,0],"text":"Definitions decide who is covered. An operator is someone who runs a website or online service \"for commercial purposes\" and collects personal information from its users. Certain nonprofits are left out. Most arguments about whether a statute applies are won or lost in the definitions.","alt":"Section 6501(2), the operator definition, is highlighted on the page."},{"n":7,"cam":[0,0,0],"text":"Second, the substantive command: the sentence that says what is required or forbidden. In the COPPA statute it begins \"It is unlawful for an operator.\" In any statute, find this sentence first. Everything else in the statute serves it.","alt":"Section 6502(a)(1) is highlighted, tagged Part 4, Substantive command."},{"n":8,"cam":[0,0,0],"text":"The words that decide whether the command applies to a given case are the operative text. The COPPA statute's command reaches two categories of operators: those running a site \"directed to children,\" and any operator with \"actual knowledge\" that it is collecting from a child. Either one is enough.","alt":"Two callouts on the command: the phrase directed to children, labeled first category of operator, and the phrase actual knowledge, labeled second category of operator."},{"n":9,"cam":[0,0,0],"text":"Look closely at the first category. What makes a site \"directed to children\"? The definitions answer only halfway: a site \"targeted to children.\" What counts as targeted? The statute does not say. A word or phrase the two sides can reasonably read differently is the contested term. Most statutory cases are fights over one.","alt":"Section 6501(10) is highlighted, with a callout on the phrase targeted to children reading: what counts as targeted? The statute does not say."},{"n":10,"cam":[0,0,0],"text":"Third, the grant of power. The COPPA statute says the FTC \"shall promulgate under section 553 of title 5 regulations\" within one year. Section 553 is the APA's notice and comment process from Walkthrough 3. Then comes the list of what the rules must require: notice, parental consent, access for parents, no demanding more information than an activity needs, and security.","alt":"Section 6502(b)(1) is highlighted, tagged Part 5, Delegation."},{"n":11,"cam":[0,0,0],"text":"This grant is the belt's width, and the agency's rule must fit inside it. The FTC's rule fills in the contested term. It lists what the agency will consider in deciding whether a site targets children: its subject matter, visual content, animated characters, music, the age of its models, and more. That is what an agency's rule adds.","alt":"An amber box labeled COPPA Rule, 16 C.F.R. section 312.2 lists the factors the FTC weighs, sitting above the targeted to children callout."},{"n":12,"cam":[0,0,0],"text":"Now open the organic statute. Because the FTC Act builds the FTC, it has a piece the COPPA statute lacks: the agency's structure. It creates a commission of five commissioners, appointed by the President with the Senate's consent, no more than three from the same political party, serving seven-year terms.","alt":"A second page appears, the Federal Trade Commission Act of 1914 as amended, with section 41 highlighted and tagged Part 3, Agency structure."},{"n":13,"cam":[0,0,0],"text":"The same section says a commissioner may be removed \"for inefficiency, neglect of duty, or malfeasance in office.\" On its face that only permits removal. But the background rule is that the President may remove executive officers at will, so for ninety years a list of causes was read to mean \"only for\" those causes: a limit on the President, not a permission. Those words are still in the statute. In 2026 the Supreme Court held that the limit cannot be enforced. A statute is always read alongside the Constitution. Walkthrough 7 comes back to this.","alt":"The removal sentence of section 41 is highlighted, tagged Part 3, Removal, with a note beside it in red: Supreme Court, 2026, this limit on removal cannot be enforced."},{"n":14,"cam":[0,0,0],"text":"The organic statute also has its own command, and it is broad: \"unfair or deceptive acts or practices in or affecting commerce, are hereby declared unlawful.\" The next paragraph empowers and directs the Commission to prevent them. This is the FTC's home base. The FTC Act has been amended many times since 1914, and these are its current words.","alt":"Sections 45(a)(1) and 45(a)(2) are highlighted, tagged Part 4, Substantive command, and Part 6, Enforcement powers."},{"n":15,"cam":[0,0,0],"text":"Now watch the COPPA statute plug in. It says a violation of the COPPA Rule \"shall be treated as a violation of a rule defining an unfair or deceptive act or practice.\" And the FTC enforces the COPPA statute with the FTC Act's powers and penalties. The new job runs on the organic statute's machinery.","alt":"Both pages side by side. Amber connectors run from the COPPA statute's sections 6502(c) and 6505 across to the FTC Act's section 45, labeled: COPPA borrows the FTC Act's machinery."},{"n":16,"cam":[0,0,0],"text":"Two more pieces of the COPPA statute. Who else can enforce: a state's attorney general may sue in federal court on behalf of the state's residents. Relationship to other law: no state may impose liability that is \"inconsistent with\" the COPPA statute's treatment of these activities. That is a preemption clause.","alt":"Sections 6504 and 6502(d) are highlighted, tagged Part 8, Who else can enforce, and Part 9, Relationship to other law."},{"n":17,"cam":[0,0,0],"text":"Last, the pieces that are easy to miss. The housekeeping: rules for when the law took effect, and a duty to review it and report to Congress. And one piece the COPPA statute does not have at all: a section of findings or purpose, though many statutes open with one.","alt":"Section 6506 is highlighted, tagged Part 10, Housekeeping, beside a dashed empty box: Part 1, Findings and purpose, none in the COPPA statute."},{"n":18,"cam":[0,0,0],"text":"So a statute is not a jumble. It has parts, and you read them in a set order. Here is how to read any enabling statute. Find the definitions. Find the command, and the operative text inside it. Find the contested term. Then find the grant of power, and ask whether the agency's rule fits inside it. Behind it stands the organic statute, which built the agency and lends it the machinery. The quiz in class asks you to do this with a new statute.","alt":"Both pages with every part tagged and the connectors running between them. The caption a jumble of legalese? is struck through, and the list of terms from this walkthrough appears."}],"practice":[{"type":"cat","prompt":"Sort each passage from the COPPA statute by the piece of the statute it belongs to.","cats":["Definitions","Substantive command","Grant of power to the agency","Relationship to other law"],"items":[["\"The term 'child' means an individual under the age of 13.\"",0],["\"It is unlawful for an operator ... to collect personal information from a child in a manner that violates the regulations\"",1],["\"the Commission shall promulgate under section 553 of title 5 regulations that ... require ... verifiable parental consent\"",2],["\"No State or local government may impose any liability ... that is inconsistent with the treatment of those activities\"",3]],"fb":"Definitions, then the command, then the grant of power: read those three first in any enabling statute."},{"type":"mc","prompt":"Congress created the FTC in 1914 with the Federal Trade Commission Act. In 1998 it passed the COPPA statute, giving the FTC a new job. Which is the FTC's organic statute?","options":["The Federal Trade Commission Act","The COPPA statute","Both","Neither"],"answer":0,"fb":"An agency has one organic statute, the one that builds it. It can have many enabling statutes."},{"type":"mc","prompt":"Which statute enabled the COPPA Rule?","options":["The COPPA statute","The Federal Trade Commission Act","The Administrative Procedure Act","The Constitution"],"answer":0,"fb":"The COPPA statute gave the FTC the power to write this rule. The APA says how the FTC had to write it."},{"type":"mc","prompt":"A general-audience video site learns that one of its users is 11 and keeps collecting that user's personal information. Which phrase in 15 U.S.C. § 6502(a)(1) most likely brings this operator within the command?","options":["\"any operator that has actual knowledge that it is collecting personal information from a child\"","\"an operator of a website or online service directed to children\"","Neither phrase, because the command reaches only sites directed to children","\"No State or local government may impose any liability\""],"answer":0,"fb":"The command reaches two categories of operators: those whose site or service is directed to children, and any operator with actual knowledge that it is collecting personal information from a child. This site is in the second category."},{"type":"mc","prompt":"Which phrase from the COPPA statute is the best example of a contested term, one the statute leaves open to argument?","options":["\"targeted to children\"","\"an individual under the age of 13\"","\"Not later than 1 year after October 21, 1998\""],"answer":0,"fb":"The statute never says what makes a site targeted to children. The FTC's rule lists factors, and cases turn on how they apply."},{"type":"multi","prompt":"Which of these did the FTC's rule add, filling in what the statute left open? Select all that apply.","options":[["Factors for deciding whether a site targets children",true],["A list of approved methods for getting a parent's consent",true],["The age of 13",false],["The requirement that a parent consent at all",false]],"fb":"Congress set the age and required consent. The FTC filled in the details, inside the width of Congress's belt."}],"authorities":["15 U.S.C. § 41 (providing that a commissioner may be removed \"for inefficiency, neglect of duty, or malfeasance in office\").","Myers v. United States, 272 U.S. 52 (1926) (holding that the President may generally remove executive officers at will: the background rule against which a list of causes is read as a limit).","Humphrey's Executor v. United States, 295 U.S. 602 (1935) (reading the FTC Act's list of causes as the only grounds for removal and upholding it), overruled by Trump v. Slaughter (U.S. June 29, 2026)."]},{"n":3,"title":"How did the agency write that rule?","minutes":7,"build":"buildTrip2","intro":"Scroll down at your own pace. This time you travel forward: from what Congress ordered, through the agency, to the companies the rule binds. The text for each step appears beside the picture.","version":"Scroll lesson v0.9, built from script v0.6.","cardTerms":{"3":["rulemaking"],"5":["Administrative Procedure Act","APA"],"6":["notice of proposed rulemaking","Federal Register"],"7":["notice and comment"],"9":["final rule"],"11":["legislative rule"],"12":["Code of Federal Regulations","CFR"],"14":["guidance","interpretative rule"]},"terms":["rulemaking","Administrative Procedure Act (APA)","notice of proposed rulemaking","Federal Register","notice and comment","final rule","legislative rule","Code of Federal Regulations (CFR)","guidance","interpretative rule"],"beats":[{"n":1,"cam":[1150,440,2000],"text":"In Walkthrough 1 you traced a question on your screen back to Congress. Along the way you passed a list: the approved ways to get a parent's consent. The FTC wrote that list, in a rule. This walkthrough asks how they came up with that rule.","alt":"The Walkthrough 1 chain seen from a distance: Congress, the blue belt running to the FTC, the closed FTC casing, and the amber belt stamped COPPA Rule leaving to the right."},{"n":2,"cam":[1350,380,1050],"text":"A common guess is that five commissioners sat down and wrote what they wanted. That would actually be unlawful! An agency has to build a rule in a particular way, in public, and it has to show its work.","alt":"Close on the closed FTC casing. The caption reads: they just wrote it?"},{"n":3,"cam":[1350,500,1250],"text":"Open the casing. Inside a machine are gears, which are working groups of people. At the top is the head gear: for the FTC, its five commissioners. It meshes with the rulemaking gear, the staff who draft rules. A third gear is waiting for the next walkthrough.","alt":"The casing opens to show the head gear and the rulemaking gear meshing, each labeled. A third gear is a dashed outline."},{"n":4,"cam":[900,520,1150],"text":"Start with what Congress ordered. The COPPA statute's belt carries a tag: write rules requiring notice, parental consent, access, and security. Congress also gave the FTC a deadline. The agency cannot ignore the tag, and it cannot go beyond it.","alt":"The blue belt stamped COPPA (1998) enters the casing. Its tag lists the four requirements. The head gear starts to turn."},{"n":5,"cam":[2050,400,1300],"text":"How the agency must do the work comes from a different statute: the Administrative Procedure Act, or APA, passed in 1946. The enabling statute says what an agency may do. The APA says how every agency must do it.","alt":"On the path leaving the agency, a checkpoint appears, labeled APA check. Every belt the agency makes has to pass through it."},{"n":6,"cam":[1980,340,1250],"text":"Step one: tell the public. The agency publishes a notice of proposed rulemaking in the Federal Register, the government's daily publication. The notice gives the draft rule and the reasons for it. The FTC published its proposed COPPA Rule in 1999.","alt":"A pale draft belt stamped Proposed rule extends from the rulemaking gear toward the checkpoint. A page titled Federal Register shows Proposed rule and Comments invited."},{"n":7,"cam":[2200,560,2100],"text":"Step two: listen. Anyone may send a written comment: companies, parents, privacy advocates, you. That is why this process is called notice and comment. For the proposed COPPA Rule, comments came in from across the country.","alt":"A group of figures labeled The public appears. Small documents travel from them into the agency, one after another."},{"n":8,"cam":[1400,540,1300],"text":"Step three: answer. The agency must read the comments and respond to the significant ones. It may change the rule because of them. The FTC's final rule was not identical to what it first proposed.","alt":"Close on the two gears turning. Comment documents stack beside the rulemaking gear. The caption reads: read, answer, revise."},{"n":9,"cam":[2050,360,1350],"text":"Step four: publish the final rule, with a statement of its basis and purpose. That is the agency's written explanation of what it decided and why. It matters later. If the rule is challenged, a court reads that explanation to see whether the agency reasoned its way to the result.","alt":"The draft belt fills in as a solid amber belt stamped COPPA Rule and passes through the checkpoint. The Federal Register page changes to: final rule, with reasons."},{"n":10,"cam":[2350,560,1050],"text":"Who inspects the rule before it goes out? We will learn a bit more nuance later, but for now: no one outside the executive branch has a duty to do an extensive quality assurance inspection of the belt before it goes out. The agency checks its own work against four things.","alt":"A checklist hangs from the checkpoint: its enabling statute, the APA, the Constitution, any other law that applies."},{"n":11,"cam":[2820,440,1350],"text":"After a waiting period, usually at least 30 days, the rule takes effect. It now binds with the force of law. A rule made this way is called a legislative rule. It is one wide belt, and it turns every company gear it reaches.","alt":"The belt fans out to three company gears, and each begins to turn."},{"n":12,"cam":[2750,70,1100],"text":"The final rule is then filed where lawyers can find it: the Code of Federal Regulations, or CFR. The COPPA Rule is at 16 C.F.R. Part 312. Think of the Federal Register as the daily newspaper and the CFR as the bound book.","alt":"A shelf of volumes labeled Code of Federal Regulations. One volume is marked 16 C.F.R. part 312."},{"n":13,"cam":[2050,400,1300],"text":"One more thing about the APA. It is the floor, not the ceiling. A later statute can add to it, trim it, or change it, and only counts if that statute expressly states it is superseding the APA. That is why the same agency can follow different procedures for different jobs. The FTC wrote the COPPA Rule under plain notice and comment, because the COPPA statute told it to. When the FTC writes a trade regulation rule defining an unfair or deceptive practice, a different statute makes it hold a hearing where interested parties can question the evidence, and sends the rule to court under a different standard of review. So when you meet a rule, ask two questions: what did the APA require, and what did the enabling statute change?","alt":"Back to the wide shot of the checkpoint, with the COPPA Rule belt passing its APA check."},{"n":14,"cam":[2400,900,1900],"text":"Agencies also publish things that skip this whole path: FAQs, policy statements, advice. Lawyers call these guidance. The most common kind has a formal name in the APA, an interpretative rule: the agency's reading of law that already exists. Guidance is useful. But it never passed the check, so it does not grip. On its own, it is not legally enforceable.","alt":"A document labeled FAQ leaves the agency by a side path that goes around the checkpoint. It reaches a fourth company gear, which does not turn."},{"n":15,"cam":[1665,450,3500],"text":"Here is the whole path. Congress's belt arrives with its tag. The rulemaking gear drafts. The public is told, and comments. The agency answers, explains, and checks its own work. The final rule goes out as one wide belt, and into the CFR.","alt":"The whole picture, with each part lighting up in order from left to right."},{"n":16,"cam":[1665,450,3500],"text":"So the commissioners did not just write what they wanted. They built the rule in public, step by step, and left a written record of their reasons. Next: what happens when a company ignores the rule?","alt":"The caption, they just wrote it?, is struck through. The list of terms from this walkthrough appears."}],"practice":[{"type":"order","prompt":"Put the steps of notice and comment rulemaking in order.","items":["The agency publishes a notice of proposed rulemaking","The public comments","The agency considers the comments","The agency publishes the final rule with its reasons","The rule takes effect after a waiting period"],"fb":"This is the path every binding rule must travel, and the agency checks its own work along the way."},{"type":"cat","prompt":"Sort each document.","cats":["Legislative rule (binds the public)","Guidance (does not bind)"],"items":[["The COPPA Rule",0],["An FAQ page on the agency's website",1],["A policy statement about enforcement priorities",1],["A rule adopted after notice and comment",0]],"fb":"A document that skipped notice and comment cannot bind the public with the force of law."},{"type":"mc","prompt":"True or false: the Administrative Procedure Act is what gives an agency its power to make rules.","options":["True","False"],"answer":1,"fb":"The enabling statute gives the power. The APA says how every agency must use it."},{"type":"mc","prompt":"Before a rule goes out, who outside the executive branch has a duty to inspect it?","options":["No one","The courts","Congress","The state attorneys general"],"answer":0,"fb":"The agency checks its own work. A court looks later, and only if someone with standing sues."},{"type":"blank","prompt":"A proposed rule is published in the {0}. A final rule is collected in the {1}.","bank":["Code of Federal Regulations","Congressional Record","Federal Register","United States Code"],"answers":["Federal Register","Code of Federal Regulations"],"fb":"The Federal Register is the daily publication. The CFR is the organized collection of rules in force."},{"type":"multi","prompt":"Before releasing a rule, an agency must check it against which of these? Select all that apply.","options":[["Its enabling statute",true],["The APA",true],["The Constitution",true],["Any other law that applies",true],["The President's campaign promises",false]],"fb":"These four checks are the agency's own quality assurance."},{"type":"mc","prompt":"The COPPA statute told the FTC to write its rule under the APA's notice and comment section. When the FTC writes a trade regulation rule defining an unfair or deceptive practice, a different statute adds a hearing and changes the standard of review. What does that tell you about the APA?","options":["It sets the floor. An enabling statute can add to it, trim it, or change it, and must say so expressly","It sets the ceiling. No statute may require more than the APA does","It applies only to the FTC","It applies only to rules, never to orders"],"answer":0,"fb":"The APA is the minimum. A later statute can add procedures, cut them, or change them, and it has to say so expressly. So the same agency can follow different procedures for different jobs, depending on which statute sent the work."}],"authorities":["5 U.S.C. § 553 (the notice and comment procedure for rules).","5 U.S.C. § 559 (providing that a later statute supersedes the APA only \"to the extent that it does so expressly\").","15 U.S.C. § 6502(b)(1) (directing the FTC to promulgate the COPPA regulations \"under section 553 of title 5\" not later than one year after October 21, 1998).","15 U.S.C. § 57a(b)-(c) (requiring the FTC, when prescribing a trade regulation rule defining unfair or deceptive acts or practices, to follow section 553 and also to provide an opportunity for an informal hearing at which interested persons have limited rights of cross-examination).","15 U.S.C. § 57a(e)(3) (providing that a court reviewing a trade regulation rule sets it aside if the Commission's findings are not supported by substantial evidence in the rulemaking record taken as a whole, in place of ordinary review).","COPPA Rule, 16 C.F.R. pt. 312."]},{"n":4,"title":"What happens when a company ignores the rule?","minutes":8,"build":"buildTrip3","intro":"Scroll down at your own pace. This walkthrough follows one case against one company, from the first complaint to the order that ends it. The text for each step appears beside the picture.","version":"Scroll lesson v0.7, built from script v0.6.","cardTerms":{"4":["adjudication"],"5":["order"],"6":["enforcement action","complaint"],"8":["administrative law judge"],"9":["separation of functions"],"11":["civil penalties"],"12":["consent order"]},"terms":["adjudication","order","enforcement action","complaint","administrative law judge","formal adjudication","informal adjudication","public rights","separation of functions","civil penalties","consent order"],"beats":[{"n":1,"cam":[2050,440,2500],"text":"Walkthrough 3 ended with a rule in force, turning every company it reaches. Now picture a video app that is popular with nine-year-olds. It never asks anyone's age. It collects children's names, locations, and viewing habits with no parent's consent. It is ignoring the rule. What happens next?","alt":"The opened FTC, with the wide belt stamped COPPA Rule fanning out to three company gears. Two are turning. The third, labeled a video app, is still."},{"n":2,"cam":[1350,440,1250],"text":"A common guess is that the agency just sends the company a fine. It cannot. An agency has to bring a case and prove it, and someone has to decide it. This walkthrough follows one case from start to finish.","alt":"Close on the FTC. The caption reads: they just send a fine?"},{"n":3,"cam":[1800,330,1900],"text":"First the agency has to find out. Parents complain. Reporters write stories. The agency's own staff notice. The FTC opens an investigation: it asks the company for documents and answers.","alt":"Figures labeled parents, reporters, agency staff appear. Signals travel from them into the agency, and the head gear turns."},{"n":4,"cam":[1330,540,950],"text":"In Walkthrough 3 one gear was waiting. Here it is: the adjudication gear. Adjudication means deciding how the law applies to one party, the way a court does. The rulemaking gear writes rules for everyone. The adjudication gear decides cases about someone.","alt":"The dashed outline inside the casing fills in as a third gear, labeled Adjudication gear."},{"n":5,"cam":[2350,470,2300],"text":"Each of those gears makes its own kind of belt. Rulemaking makes a rule: wide, looking forward, binding everyone in a class. Adjudication makes an order: narrow, looking back at what one named party did, and binding that party.","alt":"The wide rule belt, and beneath it a pale narrow belt running to the one still gear, each labeled."},{"n":6,"cam":[2300,640,1800],"text":"If the staff believe the company broke the law, the commissioners vote on whether to bring an enforcement action. It begins with a complaint: a document that names the company and says what it did wrong.","alt":"A document labeled Complaint travels from the agency to the video app's gear."},{"n":7,"cam":[2050,820,1900],"text":"Now the road forks. The FTC can try the case inside the agency, or the case can go to a federal court, which is an Article III court. Which road is open depends on what the statute allows and on what the agency is asking for.","alt":"Two dashed roads leave the agency, one looping back inside and one running down to a casing labeled Courts, which appears."},{"n":8,"cam":[1350,690,1050],"text":"Road one stays inside the agency. An administrative law judge, an official who works at the agency but does not answer to its prosecutors, holds a hearing. Both sides present evidence. Despite the title, this judge is not part of the judicial branch. The judge works inside the agency, in the executive branch. The judge issues an initial decision, and the losing side can appeal to the commissioners, who have the final word.","alt":"Inside the casing, below the gears: the prosecuting staff on one side, the judge at a desk on the other. The adjudication gear turns."},{"n":9,"cam":[1350,690,1050],"text":"The APA has names for all of this. The process is adjudication, and what it produces is an order (5 U.S.C. section 551(6) and (7)). When a statute requires the decision to be made on the record after an agency hearing, the APA's trial-type procedures apply (sections 554, 556, and 557), an administrative law judge usually presides, and lawyers call that formal adjudication. The FTC's version is its administrative proceeding. Everything else is informal adjudication, and that is most of what agencies do: licenses, permits, benefits.","alt":"The hearing stays on screen. The term formal adjudication rises under the casing, then informal adjudication beside it."},{"n":10,"cam":[1350,690,1050],"text":"So why is this hearing not a court? The judge works inside the agency that is a party to the case, and has neither life tenure nor a protected salary, which judges of an Article III court have. Congress may send public rights disputes, meaning disputes that arise under a federal regulatory scheme, to an agency to decide. The limit came in SEC v. Jarkesy, a 2024 Supreme Court case: when an agency seeks civil penalties for conduct that resembles a common law claim such as fraud, the Seventh Amendment gives the defendant a jury, and that means an Article III court.","alt":"The same hearing. The term public rights rises under the casing."},{"n":11,"cam":[1350,690,1050],"text":"Notice what just happened. One agency wrote the rule, brought the case, and judged it. That combination is why critics have called agencies a fourth branch of government. The APA's answer is a wall inside the agency, called separation of functions: staff who investigate or prosecute a case may not advise the person who decides it.","alt":"A dashed wall rises between the prosecuting staff and the judge."},{"n":12,"cam":[2350,600,1800],"text":"If the company loses, the agency issues its final order: stop the practice, delete the data, report back. The narrow belt now grips this one company, and its gear begins to turn the way the rule requires. Other agencies vary the details, but the shape is common: a hearing officer decides first, and the agency's leadership or a review board has the final word.","alt":"The narrow belt turns solid, stamped Order, and the video app's gear starts to turn."},{"n":13,"cam":[2400,900,1800],"text":"Road two leaves the agency. The government files the complaint in a federal district court, an Article III court, and there the agency is only a party, like any other plaintiff. A federal judge decides, and the order comes from the court. COPPA Rule cases usually take this road, because the FTC is asking for civil penalties: money paid to the government for breaking the rule. The reason is statutory. Under the FTC Act, the Commission gets a civil penalty for a rule violation only by suing in a district court (15 U.S.C. section 45(m)(1)(A)). That is a different limit from the Seventh Amendment one in Jarkesy.","alt":"The complaint travels down to the Courts casing. A plain belt stamped Court order runs from the court to the video app."},{"n":14,"cam":[2200,800,1250],"text":"Most cases never reach a decision. The company and the agency negotiate, and the company agrees to terms: pay a penalty, change its practices, accept monitoring for years. The agreement is written up as a consent order. It binds the company like any other order.","alt":"A page titled Consent order with three lines: pay a penalty, change practices, report for years."},{"n":15,"cam":[2750,900,1400],"text":"An order is not the end. If the company violates it, the consequences grow, and the agency can go to court to enforce it. And if the company believes the order is unlawful, it can ask a court to review it. That is the next walkthrough.","alt":"A dashed road from the video app to the Courts casing, labeled: asks a court to review, next walkthrough."},{"n":16,"cam":[2050,640,3300],"text":"Here is the whole path. The agency finds out and investigates. The commissioners vote, and a complaint goes out. The case is tried inside the agency or in a federal court, or it settles. It ends in an order: one narrow belt, for one company.","alt":"The whole p
